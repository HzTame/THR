<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join THR Family</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<style>
:root{--ink:#050509;--ember:#c9743a;--glow:#f2c48a;--mist:#8f8aa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% 108%,#3a1e16 0%,#1a1224 38%,var(--ink) 75%);background-color:var(--ink);color:#e9e4ef;font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-weight:300;font-size:.95rem;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;max-width:520px;margin:0 auto;padding:40px 20px 56px}
h1{font-weight:300;font-size:clamp(2rem,8vw,2.7rem);letter-spacing:0;line-height:1.15;margin:0 0 14px}
p.lead{line-height:1.7;color:var(--mist);margin:0 0 28px}
form{border-left:2px solid var(--ember);padding-left:18px;display:grid;gap:18px}
label{display:block;font-size:.8rem;color:var(--glow);letter-spacing:0;margin-bottom:6px}
label small{color:var(--mist);font-weight:300}
input,select{width:100%;font:inherit;font-size:1rem;color:#e9e4ef;background:rgba(11,10,20,.8);border:1px solid rgba(201,116,58,.45);border-radius:8px;padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#5f5a72}
input:focus,select:focus{border-color:var(--glow);box-shadow:0 0 0 3px rgba(242,196,138,.18)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--glow) 50%),linear-gradient(135deg,var(--glow) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
option{background:#1a1224;color:#e9e4ef}
.up{display:flex;align-items:center;gap:14px}
#prev{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid rgba(201,116,58,.45);background:rgba(11,10,20,.8);flex:none}
#prev[hidden]{display:none}
#ph{width:72px;height:72px;border-radius:50%;border:1px dashed rgba(201,116,58,.6);display:grid;place-items:center;color:var(--mist);font-size:1.6rem;flex:none}
#ph[hidden]{display:none}
#photo{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pick{display:inline-block;color:var(--glow);border:1px solid var(--ember);border-radius:8px;padding:10px 14px;cursor:pointer;font-size:.9rem;transition:background .15s}
.pick:hover,#photo:focus-visible+.pick{background:rgba(201,116,58,.2)}
#rm{background:none;color:var(--mist);padding:6px 4px;font-size:.85rem;text-decoration:underline}
#rm:hover{background:none;color:var(--glow)}
#rm[hidden]{display:none}
button{font:inherit;font-weight:400;font-size:1rem;color:#1a1224;background:var(--glow);border:0;border-radius:8px;padding:13px 18px;cursor:pointer;transition:background .15s,transform .05s}
button:hover{background:#f7d3a6}
button:active{transform:translateY(1px)}
button:disabled{opacity:.65;cursor:wait}
#msg{min-height:1.4em;color:var(--glow);margin:0}
#msg.err{color:#ff9a9a}
#msg.ok{color:#b6e3b8}
.back{display:inline-block;margin-top:28px;color:var(--mist);text-decoration:none;border-bottom:1px solid var(--ember);padding-bottom:2px}
.back:hover{color:var(--glow)}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main>
<h1>JOIN THR</h1>
<p class="lead">กรอกข้อมูลของคุณเพื่อเข้าร่วมครอบครัว THR</p>
<form id="f" novalidate>
<div>
<label for="name">ชื่อ</label>
<input id="name" name="name" type="text" autocomplete="name" placeholder="ชื่อของคุณ" required>
</div>
<div>
<label for="tiktok">ช่อง TikTok <small>(ไม่บังคับ)</small></label>
<input id="tiktok" name="tiktok" type="text" autocomplete="off" placeholder="@username หรือลิงก์ช่อง">
</div>
<div>
<label for="youtube">ช่อง YouTube <small>(ไม่บังคับ)</small></label>
<input id="youtube" name="youtube" type="text" autocomplete="off" placeholder="@channel หรือลิงก์ช่อง">
</div>
<div>
<label for="province">จังหวัดที่อยู่</label>
<select id="province" name="province" required>
<option value="">เลือกจังหวัด</option>
</select>
</div>
<div>
<label for="photo">รูปโปรไฟล์ <small>(ไม่บังคับ, JPEG/PNG/WebP/GIF ไม่เกิน 5 MB)</small></label>
<div class="up">
<img id="prev" alt="ตัวอย่างรูป" hidden>
<div id="ph" aria-hidden="true">+</div>
<div>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<label class="pick" for="photo" style="margin:0">เลือกรูป</label>
<button type="button" id="rm" hidden>ลบรูป</button>
</div>
</div>
</div>
<button id="submit" type="submit">ส่งข้อมูล</button>
<p id="msg" aria-live="polite"></p>
</form>
<a class="back" href="thailand-dusk.html">← กลับไปหน้าแผนที่</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ใส่ Project URL และ anon/publishable key ของ Supabase ที่สองบรรทัดนี้
var SUPABASE_URL = "https://gxurnxlbtmdymrdfrhcv.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_QKnPZU1huLddOAYWOP4KPA_29Sv7C7G";
var BUCKET = "member-photos";
var MAX_FILE_SIZE = 5 * 1024 * 1024;
var ALLOWED_TYPES = ["image/jpeg", "image/png", "image/webp", "image/gif"];
var supabaseClient = null;
var supabaseConfigured = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);
if (supabaseConfigured && window.supabase) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

var PROV="Amnat Charoen;Ang Thong;Bangkok;Bueng Kan;Buriram;Chachoengsao;Chai Nat;Chaiyaphum;Chanthaburi;Chiang Mai;Chiang Rai;Chonburi;Chumphon;Kalasin;Kamphaeng Phet;Kanchanaburi;Khon Kaen;Krabi;Lampang;Lamphun;Loei;Lopburi;Mae Hong Son;Maha Sarakham;Mukdahan;Nakhon Nayok;Nakhon Pathom;Nakhon Phanom;Nakhon Ratchasima;Nakhon Sawan;Nakhon Si Thammarat;Nan;Narathiwat;Nong Bua Lamphu;Nong Khai;Nonthaburi;Pathum Thani;Pattani;Phang Nga;Phatthalung;Phayao;Phetchabun;Phetchaburi;Phichit;Phitsanulok;Phra Nakhon Si Ayutthaya;Phrae;Phuket;Prachinburi;Prachuap Khiri Khan;Ranong;Ratchaburi;Rayong;Roi Et;Sa Kaeo;Sakon Nakhon;Samut Prakan;Samut Sakhon;Samut Songkhram;Saraburi;Satun;Sing Buri;Sisaket;Songkhla;Sukhothai;Suphan Buri;Surat Thani;Surin;Tak;Trang;Trat;Ubon Ratchathani;Udon Thani;Uthai Thani;Uttaradit;Yala;Yasothon".split(";");
var sel=document.getElementById("province");
PROV.forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;sel.appendChild(o)});
var f=document.getElementById("f"),msg=document.getElementById("msg"),photo=document.getElementById("photo"),prev=document.getElementById("prev"),ph=document.getElementById("ph"),rm=document.getElementById("rm"),submitButton=document.getElementById("submit"),img="";
function setStatus(text,type){msg.className=type||"";msg.textContent=text}
function setImg(u){img=u;prev.hidden=!u;ph.hidden=!!u;rm.hidden=!u;if(u)prev.src=u;else prev.removeAttribute("src")}
photo.addEventListener("change",function(){
  var file=photo.files[0];
  if(!file){return}
  if(ALLOWED_TYPES.indexOf(file.type)===-1){setStatus("ชนิดไฟล์ไม่รองรับ กรุณาเลือก JPEG, PNG, WebP หรือ GIF","err");photo.value="";setImg("");return}
  if(file.size>MAX_FILE_SIZE){setStatus("ไฟล์มีขนาดเกิน 5 MB กรุณาเลือกรูปที่เล็กกว่านี้","err");photo.value="";setImg("");return}
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
    var M=480,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    setImg(c.toDataURL("image/jpeg",.82));setStatus("เลือกรูปแล้ว","ok");URL.revokeObjectURL(url)
  };
  im.onerror=function(){setStatus("เปิดรูปนี้ไม่ได้ ลองเลือกรูปอื่น","err");photo.value="";setImg("");URL.revokeObjectURL(url)};
  im.src=url
});
rm.addEventListener("click",function(){setImg("");photo.value="";setStatus("ลบรูปแล้ว","")});

function dataUrlToBlob(dataUrl){
  var parts=dataUrl.split(","),mime=parts[0].match(/:(.*?);/)[1],binary=atob(parts[1]),bytes=new Uint8Array(binary.length);
  for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}
function getLocalMembers(){
  try{var data=JSON.parse(localStorage.getItem("thr_members")||"[]");return Array.isArray(data)?data:[]}
  catch(e){throw new Error("อ่านข้อมูลในเครื่องไม่ได้ พื้นที่จัดเก็บอาจเต็มหรือถูกปิด")}
}
function saveLocally(d){
  var members=getLocalMembers();members.push({name:d.name,tiktok:d.tiktok,youtube:d.youtube,province:d.province,photo:img,at:d.created_at});
  try{localStorage.setItem("thr_members",JSON.stringify(members))}
  catch(e){throw new Error("บันทึกในเครื่องไม่สำเร็จ พื้นที่จัดเก็บอาจเต็ม")}
}
function makeObjectPath(file){
  var ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":file.type==="image/gif"?"gif":"jpg";
  return Date.now()+"-"+crypto.randomUUID()+"."+ext;
}
async function saveToSupabase(d){
  var photoUrl=null;
  if(photo.files[0]){
    if(!supabaseClient)throw new Error("โหลด Supabase ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่");
    setStatus("กำลังอัปโหลดรูป...","");
    var file=photo.files[0],path=makeObjectPath(file),blob=dataUrlToBlob(img);
    var upload=await supabaseClient.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg",upsert:false});
    if(upload.error)throw upload.error;
    photoUrl=supabaseClient.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }
  setStatus("กำลังบันทึกข้อมูล...","");
  var result=await supabaseClient.from("members").insert({name:d.name,tiktok:d.tiktok||null,youtube:d.youtube||null,province:d.province,photo_url:photoUrl,created_at:d.created_at});
  if(result.error)throw result.error;
}
function errorMessage(error){
  var message=error&&error.message?error.message:"เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ";
  if(/row-level security|permission denied|not authorized/i.test(message))return "Supabase ปฏิเสธการบันทึก กรุณาตรวจสอบสิทธิ์ RLS ของตาราง members และ Storage";
  if(/bucket.*not found|no such bucket/i.test(message))return "ไม่พบ Storage bucket ชื่อ member-photos ใน Supabase";
  if(/failed to fetch|network|load failed/i.test(message))return "เชื่อมต่อ Supabase ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตและ Project URL";
  return "บันทึกไม่สำเร็จ: "+message;
}
f.addEventListener("submit",async function(e){
  e.preventDefault();
  var d={name:f.elements.name.value.trim(),tiktok:f.elements.tiktok.value.trim(),youtube:f.elements.youtube.value.trim(),province:f.elements.province.value,photo_url:null,created_at:new Date().toISOString()};
  if(!d.name||!d.province){setStatus("กรุณากรอกชื่อและเลือกจังหวัด","err");return}
  if(photo.files[0]&&(ALLOWED_TYPES.indexOf(photo.files[0].type)===-1||photo.files[0].size>MAX_FILE_SIZE)){setStatus("กรุณาเลือกไฟล์รูปที่รองรับและมีขนาดไม่เกิน 5 MB","err");return}
  submitButton.disabled=true;
  try{
    if(supabaseConfigured){await saveToSupabase(d);setStatus("บันทึกข้อมูลขึ้น Supabase สำเร็จ ยินดีต้อนรับคุณ "+d.name,"ok")}
    else{saveLocally(d);setStatus("ยังไม่ได้ตั้งค่า Supabase ข้อมูลนี้บันทึกไว้ในอุปกรณ์นี้เท่านั้น ขอบคุณ "+d.name,"ok")}
    f.reset();setImg("");photo.value=""
  }catch(error){setStatus(errorMessage(error),"err")}
  finally{submitButton.disabled=false}
});

var cv=document.getElementById("stars"),x=cv.getContext("2d"),S=[];
function size(){cv.width=innerWidth;cv.height=innerHeight;S=[];for(var i=0;i<140;i++)S.push([Math.random()*cv.width,Math.random()*cv.height*.7,Math.random()*1.2+.2,Math.random()*6])}
function draw(t){x.clearRect(0,0,cv.width,cv.height);S.forEach(function(s){x.globalAlpha=.25+.45*Math.abs(Math.sin(t/2500+s[3]));x.fillStyle="#dcd6ee";x.beginPath();x.arc(s[0],s[1],s[2],0,7);x.fill()});if(!matchMedia("(prefers-reduced-motion:reduce)").matches)requestAnimationFrame(draw)}
size();addEventListener("resize",size);requestAnimationFrame(draw);
</script>
</body>
</html>
