<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join THR Family</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<style>

:root{--ink:#050509;--ember:#c9743a;--glow:#f2c48a;--mist:#8f8aa3;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% 108%,#3a1e16 0%,#1a1224 38%,var(--ink) 75%);color:#e9e4ef;font-family:"Inter","Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
input,select{width:100%;font:inherit;color:#e9e4ef;background:rgba(11,10,20,.82);border:1px solid rgba(201,116,58,.45);border-radius:10px;padding:12px 14px;outline:none}
input:focus,select:focus{border-color:var(--glow);box-shadow:0 0 0 3px rgba(242,196,138,.16)}
label{display:block;margin-bottom:6px;color:var(--glow);font-size:.82rem}
label small{color:var(--mist)}
button{font:inherit;font-weight:500;color:#171018;background:linear-gradient(135deg,var(--glow),var(--ember));border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.back{display:block;margin-top:18px;text-align:center;color:var(--mist);text-decoration:none}
.back:hover{color:var(--glow)}

main{position:relative;width:min(100%,560px);margin:0 auto;padding:max(30px,env(safe-area-inset-top)) 18px max(48px,env(safe-area-inset-bottom))}
h1{margin:0 0 8px;font-size:clamp(2rem,8vw,2.7rem);font-weight:300}
.lead{color:var(--mist);line-height:1.6;margin:0 0 24px}
.card{padding:22px;border:1px solid rgba(242,196,138,.25);border-radius:22px;background:linear-gradient(180deg,rgba(25,18,32,.9),rgba(8,7,14,.94));box-shadow:0 16px 48px rgba(0,0,0,.48)}
form{display:grid;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.up{display:flex;align-items:center;gap:14px}
#prev,#ph{width:78px;height:78px;border-radius:50%;flex:none}
#prev{object-fit:cover;border:2px solid rgba(242,196,138,.6)}
#ph{display:grid;place-items:center;border:1px dashed rgba(201,116,58,.6);color:var(--mist);font-size:1.5rem}
#prev[hidden],#ph[hidden],#rm[hidden]{display:none}
#photo{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pick{display:inline-block;color:var(--glow);border:1px solid var(--ember);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:.86rem}
#rm{width:auto;background:transparent;color:var(--mist);padding:8px}
#msg{min-height:1.4em;margin:3px 0 0;color:var(--glow);font-size:.86rem;line-height:1.5}
#msg.err{color:#ff9a9a}#msg.ok{color:#b6e3b8}
.login-note{margin-top:16px;text-align:center;color:var(--mist);font-size:.87rem}
.login-note a{color:var(--glow)}
@media(max-width:500px){main{padding-left:12px;padding-right:12px}.card{padding:16px;border-radius:18px}.two{grid-template-columns:1fr}}
</style>

<style id="thr-ultra-smooth-style">
html{scroll-behavior:smooth}
body{--mx:50vw;--my:20vh}
body::before{
  content:"";
  position:fixed;
  left:0;top:0;
  width:280px;height:280px;
  border-radius:50%;
  pointer-events:none;
  z-index:-1;
  opacity:.20;
  background:radial-gradient(circle,rgba(242,196,138,.22) 0%,rgba(201,116,58,.08) 38%,transparent 72%);
  transform:translate3d(calc(var(--mx) - 140px),calc(var(--my) - 140px),0);
  will-change:transform;
}
button,a,input,select,.card,.account-card,#profile,.member,.music-box{
  -webkit-tap-highlight-color:transparent;
}
button,a{
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,filter .18s ease,background-color .18s ease,border-color .18s ease!important;
}
button:not(:disabled):active,a:active{transform:scale(.975)}
input,select{
  transition:border-color .16s ease,box-shadow .16s ease,background-color .16s ease,transform .16s ease!important;
}
input:focus,select:focus{transform:translateZ(0) scale(1.006)}
.card,.account-card,#profile,.music-box{
  transform:translateZ(0);
  backface-visibility:hidden;
  will-change:transform;
}
.thr-reveal{
  opacity:0;
  transform:translate3d(0,18px,0) scale(.985);
}
.thr-reveal.thr-in{
  opacity:1;
  transform:translate3d(0,0,0) scale(1);
  transition:opacity .52s cubic-bezier(.16,1,.3,1),transform .52s cubic-bezier(.16,1,.3,1);
}
.thr-ripple{
  position:fixed;
  width:8px;height:8px;
  margin:-4px 0 0 -4px;
  border-radius:50%;
  pointer-events:none;
  z-index:99999;
  border:1px solid rgba(242,196,138,.75);
  box-shadow:0 0 18px rgba(242,196,138,.35);
  animation:thrRipple .5s ease-out forwards;
}
@keyframes thrRipple{
  to{opacity:0;transform:scale(5)}
}
.thr-shine{
  position:relative;
  overflow:hidden;
}
.thr-shine::after{
  content:"";
  position:absolute;
  inset:-50% auto -50% -40%;
  width:22%;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
  transform:skewX(-18deg) translateX(-220%);
  animation:thrShine 7s ease-in-out infinite;
}
@keyframes thrShine{
  0%,78%{transform:skewX(-18deg) translateX(-220%)}
  92%,100%{transform:skewX(-18deg) translateX(760%)}
}
@media (hover:hover) and (pointer:fine){
  button:not(:disabled):hover,a:hover{transform:translateY(-1px)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  body::before,.thr-shine::after{display:none!important}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>

</section>
<a class="back" href="index.html">← กลับหน้าหลัก</a>

<script id="thr-ultra-smooth-script">
(function(){
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
  var root=document.body;
  var raf=0,lastX=innerWidth*.5,lastY=innerHeight*.2;

  function paintPointer(){
    raf=0;
    root.style.setProperty("--mx",lastX+"px");
    root.style.setProperty("--my",lastY+"px");
  }
  if(!reduce){
    addEventListener("pointermove",function(e){
      lastX=e.clientX; lastY=e.clientY;
      if(!raf)raf=requestAnimationFrame(paintPointer);
    },{passive:true});
  }

  var revealNodes=[].slice.call(document.querySelectorAll("main,.card,.account-card,.music-box,#profile"));
  revealNodes.forEach(function(el,i){
    if(el.id==="profile" && el.hidden)return;
    el.classList.add("thr-reveal");
    requestAnimationFrame(function(){
      setTimeout(function(){el.classList.add("thr-in")},Math.min(i*55,260));
    });
  });

  document.querySelectorAll("button,.pick,.music-pick,.join-link").forEach(function(el){
    el.classList.add("thr-shine");
  });

  if(fine&&!reduce){
    document.querySelectorAll(".card,.account-card,#profile").forEach(function(card){
      var tr=0;
      card.addEventListener("pointermove",function(e){
        var r=card.getBoundingClientRect();
        var px=(e.clientX-r.left)/r.width-.5;
        var py=(e.clientY-r.top)/r.height-.5;
        if(tr)return;
        tr=requestAnimationFrame(function(){
          tr=0;
          card.style.transform="perspective(900px) rotateX("+(-py*1.5)+"deg) rotateY("+(px*1.8)+"deg) translateZ(0)";
        });
      },{passive:true});
      card.addEventListener("pointerleave",function(){
        card.style.transform="perspective(900px) rotateX(0) rotateY(0) translateZ(0)";
      },{passive:true});
    });
  }

  document.addEventListener("pointerdown",function(e){
    if(reduce)return;
    if(!e.target.closest("button,a,.pick,.music-pick,.member,.member-marker"))return;
    var ring=document.createElement("span");
    ring.className="thr-ripple";
    ring.style.left=e.clientX+"px";
    ring.style.top=e.clientY+"px";
    document.body.appendChild(ring);
    setTimeout(function(){ring.remove()},520);
  },{passive:true});
})();
</script>
