:root{--ink:#050509;--ember:#c9743a;--glow:#f2c48a;--mist:#8f8aa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% 108%,#3a1e16 0%,#1a1224 38%,var(--ink) 75%);background-color:var(--ink);color:#e9e4ef;font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-weight:300;font-size:.95rem;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;max-width:1000px;margin:0 auto;padding:40px 20px 56px;display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width:800px){main{grid-template-columns:300px minmax(0,1fr);gap:40px;align-items:start;padding-top:32px}section{position:sticky;top:40px}}
h1{font-weight:300;font-size:clamp(2rem,3.8vw,2.7rem);letter-spacing:-.02em;line-height:1.15;margin:0 0 18px;overflow-wrap:anywhere}@media(max-width:799px){h1{font-size:clamp(2.2rem,10vw,3rem)}}
p{line-height:1.6;color:var(--mist);max-width:32em;margin:0 0 20px;font-size:.95rem;line-height:1.7;letter-spacing:0}
#info{min-height:4.5em;border-left:2px solid var(--ember);padding-left:14px}
#info b{display:block;font-weight:400;font-size:1.2rem;letter-spacing:-.01em;color:var(--glow)}
#info span{color:var(--mist)}
svg.map{width:100%;height:auto;max-height:92vh;overflow:visible}
.land{fill:#0b0a14;stroke:var(--ember);stroke-width:3;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.2s ease-out forwards;filter:drop-shadow(0 0 10px rgba(201,116,58,.35))}
@keyframes draw{to{stroke-dashoffset:0}}
.c{cursor:pointer;opacity:0;animation:on 1s ease-out forwards}
.c .d{fill:var(--glow)}
.c .h{fill:var(--glow);opacity:.12}
.member-marker{pointer-events:none;filter:drop-shadow(0 1px 5px rgba(0,0,0,.9))}
.c:hover .h,.c:focus .h,.c.on .h{opacity:.55}
.c:focus{outline:none}
.c text{fill:#d9d2e6;font-size:15px;font-family:inherit;font-weight:400;paint-order:stroke;stroke:#050509;stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .15s;pointer-events:none}
.c.on text{opacity:1;fill:var(--glow);font-weight:500}
@keyframes on{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.land{animation:none;stroke-dashoffset:0}.c{animation:none;opacity:1}}
.join-link{display:inline-block;margin:22px 0 18px;color:var(--ink);background:var(--glow);border-radius:6px;padding:10px 14px;text-decoration:none;font-weight:400}
.join-link:hover{background:#f7d3a6}
#member-status{font-size:.82rem;margin:0 0 12px;color:var(--mist)}
#members{display:grid;gap:8px;max-height:34vh;overflow:auto;padding-right:4px}
.member{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:10px;border-bottom:1px solid rgba(201,116,58,.25);padding:7px 0}
.member img,.member .no-photo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#17131f;border:1px solid rgba(201,116,58,.45)}
.member .no-photo{display:grid;place-items:center;color:var(--mist)}
.member strong{display:block;color:#e9e4ef;font-weight:400;overflow-wrap:anywhere}
.member small{display:block;color:var(--mist);overflow-wrap:anywhere}
</style>
