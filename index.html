function newShooter(t){
  var fromRight=Math.random()<.55;
  var x=fromRight?rnd(w*.58,w*.96):rnd(w*.18,w*.55);
  var y=rnd(h*.05,h*.38);
  var vx=fromRight?-rnd(.42,.72):rnd(.42,.72);
  var vy=rnd(.20,.42);
  var len=rnd(90,180);
  shooters.push({
    x:x,y:y,vx:vx,vy:vy,len:len,
    born:t,life:rnd(700,1150),alpha:0
  });
}

function drawStar(s,t){
  var a=s.base+s.amp*(.5+.5*Math.sin(t*s.speed+s.phase));
  a=Math.max(.06,Math.min(.96,a));
  ctx.globalAlpha=a;
  ctx.fillStyle=s.warm?"#ffe5bc":"#f3f1ff";
  ctx.beginPath();
  ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
  ctx.fill();

  if(s.r>1.05 && a>.58){
    ctx.globalAlpha=a*.22;
    ctx.strokeStyle=s.warm?"#f2c48a":"#e8e5ff";
    ctx.lineWidth=.6;
    ctx.beginPath();
    ctx.moveTo(s.x-3.2,s.y);ctx.lineTo(s.x+3.2,s.y);
    ctx.moveTo(s.x,s.y-3.2);ctx.lineTo(s.x,s.y+3.2);
    ctx.stroke();
  }
}

function drawShooter(sh,t){
  var age=t-sh.born;
  var p=age/sh.life;
  if(p<0||p>1)return false;

  sh.x+=sh.vx*16.67;
  sh.y+=sh.vy*16.67;

  var fade=p<.18?p/.18:(1-p);
  var mag=Math.sqrt(sh.vx*sh.vx+sh.vy*sh.vy)||1;
  var ux=sh.vx/mag,uy=sh.vy/mag;
  var tx=sh.x-ux*sh.len,ty=sh.y-uy*sh.len;

  var g=ctx.createLinearGradient(tx,ty,sh.x,sh.y);
  g.addColorStop(0,"rgba(242,196,138,0)");
  g.addColorStop(.72,"rgba(242,196,138,"+(fade*.34)+")");
  g.addColorStop(1,"rgba(255,247,232,"+(fade*.95)+")");
  ctx.globalAlpha=1;
  ctx.strokeStyle=g;
  ctx.lineWidth=1.35;
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(sh.x,sh.y);ctx.stroke();

  ctx.globalAlpha=fade*.95;
  ctx.fillStyle="#fff7e8";
  ctx.beginPath();ctx.arc(sh.x,sh.y,1.35,0,Math.PI*2);ctx.fill();

  return sh.x>-220&&sh.x<w+220&&sh.y<h+220;
}

function frame(t){
  ctx.clearRect(0,0,w,h);
  for(var i=0;i<stars.length;i++)drawStar(stars[i],t);

  if(!reduce){
    if(t>=nextShoot){
      newShooter(t);
      if(!mobile && Math.random()<.20){
        setTimeout(function(){
          var now=performance.now();
          newShooter(now);
        },rnd(130,280));
      }
      nextShoot=t+rnd(mobile?4200:3200,mobile?7600:6500);
    }

    for(var j=shooters.length-1;j>=0;j--){
      if(!drawShooter(shooters[j],t))shooters.splice(j,1);
    }
  }

  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}

reset();
nextShoot=performance.now()+rnd(900,2200);
addEventListener("resize",function(){
  mobile=matchMedia("(max-width:799px)").matches;
  reset();
},{passive:true});
requestAnimationFrame(frame);
})();
</script>




<script id="thr-mobile-profile-portal-fix-script">
(function(){
  "use strict";
  var profile=document.getElementById("profile");
  var backdrop=document.getElementById("profile-backdrop");
  if(!profile||!backdrop)return;

  function stop(e){e.stopPropagation();}

  ["pointerdown","pointerup","click"].forEach(function(type){
    profile.addEventListener(type,stop,true);
  });

  profile.addEventListener("touchstart",stop,{capture:true,passive:true});
  profile.addEventListener("touchend",stop,{capture:true,passive:true});

  backdrop.addEventListener("pointerdown",function(e){
    e.preventDefault();
    e.stopPropagation();
  },true);

  backdrop.addEventListener("click",function(e){
    e.preventDefault();
    e.stopPropagation();
    if(typeof closeProfile==="function")closeProfile();
  },true);

  if("MutationObserver" in window){
    new MutationObserver(function(){
      if(profile.hidden){
        document.body.classList.remove("profile-mobile-open");
      }
    }).observe(profile,{attributes:true,attributeFilter:["hidden"]});
  }
})();
</script>
