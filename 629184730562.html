<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noarchive"><title>THR Organization Chart</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"><style>
:root{--ink:#050509;--gold:#f2c48a;--copper:#c9743a;--cream:#ffe0b5;--mist:#aaa4bc;--line:rgba(242,196,138,.32);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% 108%,#3a1e16 0%,#1a1224 38%,var(--ink) 75%);color:#eee9f5;font-family:Inter,"Helvetica Neue",Arial,sans-serif}.shell{width:min(1220px,100%);margin:auto;padding:28px 18px 56px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.brand h1{margin:0;font-size:clamp(2rem,6vw,3.2rem);font-weight:300;background:linear-gradient(100deg,#fff,var(--cream),#d79a6a);-webkit-background-clip:text;background-clip:text;color:transparent}.brand p{margin:10px 0 0;color:var(--mist);line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}a.btn,button{font:inherit;font-weight:500;color:#171018;background:linear-gradient(135deg,var(--gold),var(--copper));border:0;border-radius:10px;padding:11px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}a.ghost,button.ghost{color:var(--gold);background:rgba(10,8,16,.58);border:1px solid rgba(242,196,138,.34)}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{flex:1;min-width:0;font:inherit;color:#eee9f5;background:rgba(9,8,16,.76);border:1px solid rgba(201,116,58,.45);border-radius:10px;padding:12px}.summary{display:flex;gap:10px;flex-wrap:wrap;color:var(--mist);font-size:.9rem;margin-bottom:16px}.summary span{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035)}.summary b{color:var(--cream)}.status{min-height:1.4em;color:var(--gold);font-size:.86rem;margin:8px 0 14px}.status.err{color:#ff9a9a}.chart{position:relative;padding:28px 18px 34px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(31,22,40,.88),rgba(8,7,14,.94));overflow:hidden}.level{position:relative;display:grid;justify-items:center}.level:not(:last-child){padding-bottom:46px}.level:not(:last-child)::after{content:"";position:absolute;bottom:0;left:50%;width:2px;height:30px;background:var(--gold);opacity:.7}.nodes{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:14px;width:100%;max-width:1100px}.level:not(:first-child) .nodes::before{content:"";position:absolute;top:-18px;left:7%;right:7%;height:2px;background:var(--gold);opacity:.7}.node{position:relative;width:170px;min-height:116px;display:grid;justify-items:center;align-content:center;gap:6px;padding:12px 10px;border:1px solid rgba(242,196,138,.34);border-radius:12px;background:linear-gradient(180deg,rgba(42,29,47,.96),rgba(15,11,23,.98));text-align:center}.level:not(:first-child) .node::before{content:"";position:absolute;top:-18px;left:50%;width:2px;height:18px;background:var(--gold);opacity:.7}.node.admin{border-color:rgba(242,196,138,.72);box-shadow:0 0 22px rgba(242,196,138,.1)}.node.deputy_admin{border-color:rgba(145,178,255,.58)}.node.member{border-color:rgba(242,196,138,.22)}.avatar,.no-avatar{width:48px;height:48px;border-radius:50%;border:1px solid rgba(242,196,138,.5);background:#17131f}.avatar{object-fit:cover}.no-avatar{display:grid;place-items:center;color:var(--gold);font-size:.7rem}.node strong{max-width:100%;color:#fff;font-weight:500;overflow-wrap:anywhere}.node small{color:var(--mist);font-size:.75rem;overflow-wrap:anywhere}.rank-label{display:inline-flex;padding:4px 9px;border-radius:999px;color:var(--cream);background:rgba(242,196,138,.12);font-size:.72rem}.empty{color:var(--mist);padding:18px}.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:18px;color:var(--mist);font-size:.8rem}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}.dot.blue{background:#91b2ff}.dot.muted{background:#8e8798}@media(max-width:700px){.top{display:grid}.actions{justify-content:flex-start}.chart{padding-left:10px;padding-right:10px}.nodes{gap:10px}.node{width:min(155px,calc(50% - 8px))}}@media(max-width:440px){.shell{padding-left:12px;padding-right:12px}a.btn,button{width:100%;text-align:center}.toolbar{display:grid}.node{width:100%;max-width:240px}.level:not(:last-child) .nodes::before{left:15%;right:15%}}
</style></head><body><main class="shell"><div class="top"><div class="brand"><h1>THR ORGANIZATION</h1><p>ผังลำดับยศและโครงสร้างการดูแลสมาชิก</p></div><div class="actions"><a class="btn ghost" href="381746205914.html">หน้าแอดมิน</a><a class="btn ghost" href="index.html">หน้าหลัก</a></div></div><div class="toolbar"><input id="search" type="search" placeholder="ค้นหาชื่อ จังหวัด หรือ User ID"><button id="refresh" type="button">รีเฟรช</button></div><div id="summary" class="summary"></div><p id="status" class="status" aria-live="polite">กำลังโหลดข้อมูล...</p><section class="chart" aria-label="ผังลำดับยศ"><div id="chart"></div><div class="legend"><span><i class="dot"></i> แอดมิน</span><span><i class="dot blue"></i> รองแอดมิน</span><span><i class="dot muted"></i> สมาชิก</span></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
var SUPABASE_URL="https://gxurnxlbtmdymrdfrhcv.supabase.co";
var SUPABASE_ANON_KEY="sb_publishable_QKnPZU1huLddOAYWOP4KPA_29Sv7C7G";
var client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),allMembers=[];
var ranks=[{key:"admin",title:"แอดมิน",note:"ผู้ดูแลระบบและมอบยศ"},{key:"deputy_admin",title:"รองแอดมิน",note:"ผู้ช่วยดูแลระบบ"},{key:"member",title:"สมาชิก",note:"สมาชิกทั่วไป"}];
function esc(v){return String(v==null?"":v).replace(/[&<>'"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]})}
function setStatus(t,error){var el=document.getElementById("status");el.textContent=t;el.className=error?"status err":"status"}
function render(){
  var q=document.getElementById("search").value.trim().toLowerCase();
  var filtered=allMembers.filter(function(m){return !q||[m.name,m.province,m.user_id].join(" ").toLowerCase().indexOf(q)>-1});
  document.getElementById("summary").innerHTML=ranks.map(function(r){return'<span>'+r.title+': <b>'+allMembers.filter(function(m){return(m.role||"member")===r.key}).length+'</b></span>'}).join("");
  document.getElementById("chart").innerHTML=ranks.map(function(r){
    var people=filtered.filter(function(m){return(m.role||"member")===r.key}).sort(function(a,b){return String(a.name||"").localeCompare(String(b.name||""),"th")});
    var nodes=people.length?people.map(function(m){var photo=m.photo_url?'<img class="avatar" src="'+esc(m.photo_url)+'" alt="">':'<span class="no-avatar">THR</span>';return'<article class="node '+r.key+'">'+photo+'<strong>'+esc(m.name||"ไม่ระบุชื่อ")+'</strong><span class="rank-label">'+r.title+'</span><small>'+esc(m.province||"ไม่ระบุจังหวัด")+'</small></article>'}).join(""):'<p class="empty">ไม่พบข้อมูลในลำดับนี้</p>';
    return'<section class="level"><div class="nodes">'+nodes+'</div></section>';
  }).join("");
}
async function loadMembers(){setStatus("กำลังโหลดข้อมูล...");var r=await client.from("members").select("user_id,name,province,photo_url,role").order("name",{ascending:true});if(r.error){setStatus("โหลดข้อมูลไม่สำเร็จ: "+r.error.message,true);return}allMembers=r.data||[];render();setStatus("โหลดผังลำดับยศเรียบร้อย")}
document.getElementById("search").addEventListener("input",render);document.getElementById("refresh").addEventListener("click",loadMembers);loadMembers();
</script></body></html>
