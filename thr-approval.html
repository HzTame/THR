g:22px;border:1px dashed var(--line);border-radius:14px;color:var(--mist)}@media(max-width:650px){.item{grid-template-columns:58px minmax(0,1fr)}.avatar{width:54px;height:54px}.actions-row{grid-column:1/-1}.actions-row button{flex:1}}

var SUPABASE_URL="https://gxurnxlbtmdymrdfrhcv.supabase.co",SUPABASE_ANON_KEY="sb_publishable_QKnPZU1huLddOAYWOP4KPA_29Sv7C7G";var client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),me=null,requests=[];var msg=document.getElementById('msg'),list=document.getElementById('list');function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','\"':'&quot;'}[c]})}function status(t,type){msg.textContent=t;msg.className='status '+(type||'')}function date(v){return v?new Date(v).toLocaleString('th-TH'):'-'}async function init(){var a=await client.auth.getUser();if(a.error||!a.data.user){location.replace('914672305189.html');return}me=a.data.user;var r=await client.from('members').select('role,status').eq('user_id',me.id).maybeSingle();if(r.error||!r.data||r.data.role!=='admin'){status('หน้านี้สำหรับแอดมินเท่านั้น', 'err');setTimeout(function(){location.replace('index.html')},1000);return}await load()}async function load(){status('กำลังโหลดคำขอสมัคร...');list.innerHTML='';var r=await client.from('members').select('id,user_id,name,province,photo_url,music_url,created_at,status,apply_note').eq('status','pending').order('created_at',{ascending:true});if(r.error){status('โหลดคำขอไม่สำเร็จ: '+r.error.message,'err');list.innerHTML='<div class="empty">กรุณารันไฟล์ SQL สำหรับระบบอนุมัติสมาชิกก่อน</div>';return}requests=r.data||[];document.getElementById('stats').innerHTML='<span>รออนุมัติ: <b>'+requests.length+'</b></span>';render();status('โหลดคำขอเรียบร้อย')}function render(){if(!requests.length){list.innerHTML='<div class="empty">ไม่มีคำขอสมัครที่รออนุมัติในขณะนี้</div>';return}list.innerHTML=requests.map(function(m){var photo=m.photo_url?'<img class="avatar" src="'+esc(m.photo_url)+'" alt="">':'<div class="avatar"></div>';var music=m.music_url?'<div class="player" data-src="'+esc(m.music_url)+'"><button type="button" class="pbtn" aria-label="เล่นเพลง">▶</button><div class="pmid"><input type="range" class="pseek" min="0" max="100" value="0" step="0.1" aria-label="เลื่อนเพลง"><span class="ptime">0:00 / 0:00</span></div></div>':'ยังไม่มีเพลง';return '<article class="item">'+photo+'<div><div class="name">'+esc(m.name||'ไม่ระบุชื่อ')+'</div><div class="meta">จังหวัด: '+esc(m.province||'-')+'<br>ส่งคำขอ: '+esc(date(m.created_at))+'<br>'+music+'<br>User ID: '+esc(m.user_id||'-')+'</div>'+(m.apply_note?'<div class="note"><b style="color:var(--gold);font-weight:500">คำอธิบายจากผู้สมัคร:</b><br>'+esc(m.apply_note)+'</div>':'')+'<textarea class="reply" data-reply="'+esc(m.id)+'" maxlength="500" placeholder="ข้อความตอบกลับถึงผู้สมัคร (ผู้สมัครจะเห็นเมื่อกดปฏิเสธ)"></textarea></div><div class="actions-row"><button data-approve="'+esc(m.id)+'">อนุมัติ</button><button class="reject" data-reject="'+esc(m.id)+'">ปฏิเสธ</button></div></article>'}).join('')}async function decide(id,next){if(!me){status('กรุณาเข้าสู่ระบบใหม่','err');return}var m=requests.find(function(x){return String(x.id)===String(id)});if(!m)return;var label=next==='approved'?'อนุมัติ':'ปฏิเสธ';var warn=next==='approved'?'':' ข้อมูลที่สมัครมาจะถูกลบทิ้งทันทีและย้อนกลับไม่ได้';if(!confirm('ยืนยัน'+label+'คำขอของ '+(m.name||'สมาชิก')+' หรือไม่?'+warn))return;status('กำลัง'+label+'...');stopAudio();var r;if(next!=='approved'){var ta=list.querySelector('textarea[data-reply="'+id+'"]');var nt=await client.from('application_rejections').upsert({user_id:m.user_id,name:m.name||null,message:(ta&&ta.value.trim())||null},{onConflict:'user_id'});if(nt.error){status('บันทึกข้อความตอบกลับไม่สำเร็จ: '+nt.error.message+' (ต้องรัน SQL สร้างตาราง application_rejections ก่อน)','err');return}}if(next==='approved'){r=await client.from('members').update({status:next}).eq('id',m.id).select('id')}else{r=await client.from('members').delete().eq('id',m.id).select('id')}if(r.error){status('บันทึกไม่สำเร็จ: '+r.error.message,'err');return}if(!r.data||!r.data.length){status('ไม่มีสิทธิ์ดำเนินการ (ตรวจสอบ RLS policy ของตาราง members)','err');return}if(next!=='approved'){try{function sp(u,b){var k='/object/public/'+b+'/',i=String(u||'').indexOf(k);return i<0?'':decodeURIComponent(String(u).slice(i+k.length).split('?')[0])}var pp=sp(m.photo_url,'member-photos');if(pp)await client.storage.from('member-photos').remove([pp]);var mb=sp(m.music_url,'member-music'),bk='member-music';if(!mb){mb=sp(m.music_url,'member-photos');bk='member-photos'}if(mb)await client.storage.from(bk).remove([mb])}catch(x){}}requests=requests.filter(function(x){return String(x.id)!==String(id)});render();document.getElementById('stats').innerHTML='<span>รออนุมัติ: <b>'+requests.length+'</b></span>';status(next==='approved'?'อนุมัติคำขอเรียบร้อย':'ปฏิเสธและลบข้อมูลผู้สมัครเรียบร้อย','ok')}list.addEventListener('click',function(e){var a=e.target.closest('[data-approve]'),r=e.target.closest('[data-reject]');if(a)decide(a.dataset.approve,'approved');if(r)decide(r.dataset.reject,'rejected')});var audio=null,curPlayer=null;function fmt(s){s=isFinite(s)?Math.floor(s):0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function paint(p){if(!p||!audio)return;var d=audio.duration;p.querySelector('.pseek').value=d?(audio.currentTime/d*100):0;p.querySelector('.ptime').textContent=fmt(audio.currentTime)+' / '+fmt(d)}function stopAudio(){if(audio){audio.pause();audio.src=''}if(curPlayer){curPlayer.classList.remove('playing','loading');curPlayer.querySelector('.pbtn').textContent='▶';curPlayer.querySelector('.pseek').value=0;curPlayer.querySelector('.ptime').textContent='0:00 / 0:00'}audio=null;curPlayer=null}list.addEventListener('click',function(e){var b=e.target.closest('.pbtn');if(!b)return;var p=b.closest('.player');if(curPlayer===p&&audio){if(audio.paused){audio.play();}else{audio.pause()}return}stopAudio();curPlayer=p;audio=new Audio(p.dataset.src);audio.preload='auto';p.classList.add('loading');audio.addEventListener('canplay',function(){p.classList.remove('loading')});audio.addEventListener('play',function(){p.classList.add('playing');b.textContent='❚❚';b.setAttribute('aria-label','หยุดเพลง')});audio.addEventListener('pause',function(){p.classList.remove('playing');b.textContent='▶';b.setAttribute('aria-label','เล่นเพลง')});audio.addEventListener('timeupdate',function(){paint(p)});audio.addEventListener('loadedmetadata',function(){paint(p)});audio.addEventListener('ended',stopAudio);audio.addEventListener('error',function(){p.classList.remove('loading','playing');b.textContent='▶';status('เล่นไฟล์เพลงนี้ไม่ได้','err')});audio.play().catch(function(){})});list.addEventListener('input',function(e){var s=e.target.closest('.pseek');if(!s)return;var p=s.closest('.player');if(p===curPlayer&&audio&&audio.duration)audio.currentTime=s.value/100*audio.duration});document.getElementById('refresh').addEventListener('click',load);init();
</script></body></html>
