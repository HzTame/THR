<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>THR | ตรวจสอบคำขอสมัคร</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"><style>
:root{--ink:#050509;--gold:#f2c48a;--copper:#c9743a;--cream:#ffe0b5;--mist:#aaa4bc;--line:rgba(242,196,138,.32)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% 108%,#3a1e16 0%,#1a1224 38%,var(--ink) 75%);color:#eee9f5;font-family:Inter,Arial,sans-serif}.shell{width:min(1100px,100%);margin:auto;padding:28px 18px 56px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}h1{margin:0;font-weight:300;font-size:clamp(2rem,5vw,3rem);background:linear-gradient(100deg,#fff,var(--cream),#d79a6a);-webkit-background-clip:text;background-clip:text;color:transparent}.lead{color:var(--mist);line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}a.btn,button{font:inherit;font-weight:500;color:#171018;background:linear-gradient(135deg,var(--gold),var(--copper));border:0;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none}.ghost{color:var(--gold)!important;background:rgba(10,8,16,.58)!important;border:1px solid rgba(242,196,138,.34)!important}.status{min-height:1.5em;color:var(--gold);font-size:.9rem}.status.err{color:#ff9a9a}.status.ok{color:#b6e3b8}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.stats span{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--mist)}.stats b{color:var(--cream)}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(31,22,40,.9),rgba(8,7,14,.94))}.avatar{width:68px;height:68px;object-fit:cover;border-radius:50%;border:1px solid var(--gold);background:#17131f}.name{font-size:1.05rem;color:#fff;overflow-wrap:anywhere}.meta{font-size:.82rem;color:var(--mist);line-height:1.65;overflow-wrap:anywhere}.actions-row{display:flex;gap:8px;flex-wrap:wrap}.reject{background:transparent;color:#ffb0b0;border:1px solid rgba(255,154,154,.5)}.empty{padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--mist)}@media(max-width:650px){.item{grid-template-columns:58px minmax(0,1fr)}.avatar{width:54px;height:54px}.actions-row{grid-column:1/-1}.actions-row button{flex:1}}
</style></head><body><main class="shell"><header class="top"><div><h1>THR MEMBER REVIEW</h1><p class="lead">ตรวจสอบคำขอสมัครสมาชิก และกดอนุมัติก่อนเปิดสิทธิ์เข้าใช้งาน</p></div><nav class="actions"><a class="btn ghost" href="381746205914.html">หน้าแอดมิน</a><a class="btn ghost" href="index.html">หน้าหลัก</a><button id="refresh" type="button">รีเฟรช</button></nav></header><p id="msg" class="status" aria-live="polite">กำลังตรวจสอบสิทธิ์...</p><div id="stats" class="stats"></div><section id="list" class="list"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
var SUPABASE_URL="https://gxurnxlbtmdymrdfrhcv.supabase.co",SUPABASE_ANON_KEY="sb_publishable_QKnPZU1huLddOAYWOP4KPA_29Sv7C7G";var client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),me=null,requests=[];var msg=document.getElementById('msg'),list=document.getElementById('list');function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','\"':'&quot;'}[c]})}function status(t,type){msg.textContent=t;msg.className='status '+(type||'')}function date(v){return v?new Date(v).toLocaleString('th-TH'):'-'}async function init(){var a=await client.auth.getUser();if(a.error||!a.data.user){location.replace('914672305189.html');return}me=a.data.user;var r=await client.from('members').select('role,status').eq('user_id',me.id).maybeSingle();if(r.error||!r.data||r.data.role!=='admin'){status('หน้านี้สำหรับแอดมินเท่านั้น', 'err');setTimeout(function(){location.replace('index.html')},1000);return}await load()}async function load(){status('กำลังโหลดคำขอสมัคร...');list.innerHTML='';var r=await client.from('members').select('id,user_id,name,province,photo_url,music_url,created_at,status').eq('status','pending').order('created_at',{ascending:true});if(r.error){status('โหลดคำขอไม่สำเร็จ: '+r.error.message,'err');list.innerHTML='<div class="empty">กรุณารันไฟล์ SQL สำหรับระบบอนุมัติสมาชิกก่อน</div>';return}requests=r.data||[];document.getElementById('stats').innerHTML='<span>รออนุมัติ: <b>'+requests.length+'</b></span>';render();status('โหลดคำขอเรียบร้อย')}function render(){if(!requests.length){list.innerHTML='<div class="empty">ไม่มีคำขอสมัครที่รออนุมัติในขณะนี้</div>';return}list.innerHTML=requests.map(function(m){var photo=m.photo_url?'<img class="avatar" src="'+esc(m.photo_url)+'" alt="">':'<div class="avatar"></div>';var music=m.music_url?'<audio controls preload="none" src="'+esc(m.music_url)+'" style="display:block;width:100%;max-width:340px;height:38px;margin:6px 0 2px"></audio>':'ยังไม่มีเพลง';return '<article class="item">'+photo+'<div><div class="name">'+esc(m.name||'ไม่ระบุชื่อ')+'</div><div class="meta">จังหวัด: '+esc(m.province||'-')+'<br>ส่งคำขอ: '+esc(date(m.created_at))+'<br>'+music+'<br>User ID: '+esc(m.user_id||'-')+'</div></div><div class="actions-row"><button data-approve="'+esc(m.id)+'">อนุมัติ</button><button class="reject" data-reject="'+esc(m.id)+'">ปฏิเสธ</button></div></article>'}).join('')}async function decide(id,next){if(!me){status('กรุณาเข้าสู่ระบบใหม่','err');return}var m=requests.find(function(x){return String(x.id)===String(id)});if(!m)return;var label=next==='approved'?'อนุมัติ':'ปฏิเสธ';if(!confirm('ยืนยัน'+label+'คำขอของ '+(m.name||'สมาชิก')+' หรือไม่?'))return;status('กำลัง'+label+'...');var r=await client.from('members').update({status:next}).eq('id',m.id);if(r.error){status('บันทึกไม่สำเร็จ: '+r.error.message,'err');return}requests=requests.filter(function(x){return String(x.id)!==String(id)});render();document.getElementById('stats').innerHTML='<span>รออนุมัติ: <b>'+requests.length+'</b></span>';status(''+label+'คำขอเรียบร้อย','ok')}list.addEventListener('click',function(e){var a=e.target.closest('[data-approve]'),r=e.target.closest('[data-reject]');if(a)decide(a.dataset.approve,'approved');if(r)decide(r.dataset.reject,'rejected')});list.addEventListener('play',function(e){list.querySelectorAll('audio').forEach(function(a){if(a!==e.target)a.pause()})},true);document.getElementById('refresh').addEventListener('click',load);init();
</script></body></html>
