<style id="thr-anti-source-v3-style">
html,body{
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;

  -webkit-user-select:text;

<script id="thr-anti-source-v3">
(function(){
  "use strict";

  function block(e){
    if(!e) return false;
    try{ e.preventDefault(); }catch(_){}
    try{ e.stopPropagation(); }catch(_){}
    try{ e.stopImmediatePropagation(); }catch(_){}
    return false;
  }

  function shouldBlock(e){
    var k = String(e.key || "").toLowerCase();
    var code = String(e.code || "").toLowerCase();

    return (
      e.key === "F12" || code === "f12" ||
      (e.ctrlKey && k === "u") ||
      (e.ctrlKey && k === "s") ||
      (e.ctrlKey && k === "p") ||
      (e.ctrlKey && e.shiftKey && ["i","j","c","k","e"].includes(k)) ||
      (e.metaKey && e.altKey && ["i","j","c"].includes(k)) ||
      (e.metaKey && k === "u")
    );
  }

  ["keydown","keypress","keyup"].forEach(function(type){
    window.addEventListener(type,function(e){
      if(shouldBlock(e)) return block(e);
    },true);
    document.addEventListener(type,function(e){
      if(shouldBlock(e)) return block(e);
    },true);
  });

  document.addEventListener("contextmenu",block,true);

  document.addEventListener("dragstart",function(e){
    var t=e.target;
    if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    block(e);
  },true);

  document.addEventListener("selectstart",function(e){
    var t=e.target;
    if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    block(e);
  },true);

  /* ปิดเมนู save/print บางกรณี */
  window.oncontextmenu=function(){return false};
})();
</script>

<style id="thr-premium-ui-v2">
:root{
  --thr-gold:#f2c48a;
  --thr-copper:#c9743a;
  --thr-cream:#ffe0b5;
  --thr-violet:#24152e;
  --thr-deep:#050509;
  --thr-ease:cubic-bezier(.16,1,.3,1);
}

/* ---------- ambient background ---------- */
.thr-ambient{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:-1;
}
.thr-orb{
  position:absolute;
  border-radius:50%;
  filter:blur(42px);
  opacity:.13;
  will-change:transform;
}
.thr-orb.a{
  width:min(48vw,520px);height:min(48vw,520px);
  left:-10vw;top:-12vh;
  background:radial-gradient(circle,var(--thr-gold),transparent 68%);
  animation:thrOrbA 16s ease-in-out infinite alternate;
}
.thr-orb.b{
  width:min(55vw,620px);height:min(55vw,620px);
  right:-16vw;bottom:-18vh;
  background:radial-gradient(circle,var(--thr-copper),transparent 68%);
  animation:thrOrbB 19s ease-in-out infinite alternate;
}
.thr-orb.c{
  width:min(34vw,400px);height:min(34vw,400px);
  left:42%;top:38%;
  background:radial-gradient(circle,#8c5a9b,transparent 70%);
  opacity:.07;
  animation:thrOrbC 22s ease-in-out infinite alternate;
}
@keyframes thrOrbA{to{transform:translate3d(9vw,6vh,0) scale(1.12)}}
@keyframes thrOrbB{to{transform:translate3d(-8vw,-5vh,0) scale(.92)}}
@keyframes thrOrbC{to{transform:translate3d(-7vw,8vh,0) scale(1.16)}}

/* ---------- page entrance ---------- */
body{opacity:0;transition:opacity .42s var(--thr-ease)}
body.thr-ready{opacity:1}
main,.wrap{position:relative;z-index:1}

/* ---------- glass / premium surfaces ---------- */
.card,.account-card,#profile,.music-box{
  position:relative;
  isolation:isolate;
  border-color:rgba(242,196,138,.28)!important;
  background:
    linear-gradient(180deg,rgba(31,22,40,.86),rgba(8,7,14,.91))!important;
  box-shadow:
    0 22px 70px rgba(0,0,0,.42),
    inset 0 1px 0 rgba(255,255,255,.07),
    0 0 0 1px rgba(242,196,138,.025)!important;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.card::before,.account-card::before,.music-box::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(135deg,
    rgba(255,224,181,.42),
    rgba(201,116,58,.10) 35%,
    transparent 58%,
    rgba(242,196,138,.18));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  opacity:.55;
}
.card::after,.account-card::after,.music-box::after{
  content:"";
  position:absolute;
  left:10%;right:10%;top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,224,181,.72),transparent);
  pointer-events:none;
  opacity:.55;
}

/* ---------- typography ---------- */
h1{
  text-shadow:0 0 28px rgba(242,196,138,.10);
}
body:not(.thr-index-page) h1{
  background:linear-gradient(100deg,#fff 0%,var(--thr-cream) 46%,#d79a6a 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  letter-spacing:-.025em;
}
.lead{
  letter-spacing:.005em;
}

/* ---------- inputs ---------- */
input,select{
  transition:
    border-color .18s ease,
    box-shadow .18s ease,
    background-color .18s ease,
    transform .18s var(--thr-ease)!important;
  background-color:rgba(9,8,16,.70)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
input:hover,select:hover{
  border-color:rgba(242,196,138,.62)!important;
}
input:focus,select:focus{
  transform:translateY(-1px);
  border-color:rgba(255,224,181,.96)!important;
  box-shadow:
    0 0 0 3px rgba(242,196,138,.10),
    0 8px 22px rgba(0,0,0,.18)!important;
}
label{
  transition:color .18s ease,text-shadow .18s ease,transform .18s ease;
}
div:focus-within>label{
  color:var(--thr-cream)!important;
  text-shadow:0 0 18px rgba(242,196,138,.18);
}

/* ---------- buttons / links ---------- */
button,.pick,.music-pick,.join-link,.back,.signup a,.login-note a,#profile-links a{
  -webkit-tap-highlight-color:transparent;
}
button,.pick,.music-pick,.join-link,#profile-links a{
  position:relative;
  overflow:hidden;
  transition:
    transform .18s var(--thr-ease),
    box-shadow .18s ease,
    filter .18s ease,
    border-color .18s ease,
    background-color .18s ease!important;
}
button::after,.pick::after,.music-pick::after,.join-link::after,#profile-links a::after{
  content:"";
  position:absolute;
  top:-60%;bottom:-60%;
  left:-42%;
  width:24%;
  transform:skewX(-18deg) translateX(-260%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent);
  pointer-events:none;
  opacity:0;
}
@media(hover:hover) and (pointer:fine){
  button:not(:disabled):hover,.pick:hover,.music-pick:hover,.join-link:hover,#profile-links a:hover{

    opacity:1;
    animation:thrSweep .72s var(--thr-ease);
  }
}
@keyframes thrSweep{
  from{transform:skewX(-18deg) translateX(-260%)}

}
button:not(:disabled):active,.pick:active,.music-pick:active,.join-link:active,#profile-links a:active{
  transform:translateY(0) scale(.975)!important;
}

.thr-reveal-v2{
  opacity:0;
  transform:translate3d(0,14px,0) scale(.988);
  filter:blur(4px);
}
.thr-reveal-v2.thr-in-v2{
  opacity:1;

function dataUrlToBlob(dataUrl){var parts=dataUrl.split(","),mime=parts[0].match(/:(.*?);/)[1],binary=atob(parts[1]),bytes=new Uint8Array(binary.length);for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:mime})}

photo.addEventListener("change",function(){
 var file=photo.files[0];if(!file)return;
 if(ALLOWED_TYPES.indexOf(file.type)===-1){status("รองรับเฉพาะ JPEG, PNG, WebP หรือ GIF","err");photo.value="";return}
 if(file.size>MAX_FILE_SIZE){status("รูปต้องมีขนาดไม่เกิน 5 MB","err");photo.value="";return}
 var url=URL.createObjectURL(file),im=new Image();
 im.onload=function(){var M=480,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext("2d").drawImage(im,0,0,c.width,c.height);setImg(c.toDataURL("image/jpeg",.82));URL.revokeObjectURL(url)};
 im.onerror=function(){status("เปิดรูปนี้ไม่ได้","err");photo.value="";URL.revokeObjectURL(url)};
 im.src=url;
});

async function createProfile(user,p){
 var existing=await client.from("members").select("id").eq("user_id",user.id).maybeSingle();
 if(existing.error)throw existing.error;
 if(existing.data)return;
 var photoUrl=null;
 if(p.img){
   var blob=dataUrlToBlob(p.img),path=user.id+"/"+Date.now()+".jpg";
   var up=await client.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg",upsert:false});
   if(up.error)throw up.error;
   photoUrl=client.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
 }
 var ins=await client.from("members").insert({
   user_id:user.id,name:p.name,tiktok:p.tiktok||null,youtube:p.youtube||null,
   facebook:p.facebook||null,instagram:p.instagram||null,province:p.province,
   photo_url:photoUrl,created_at:new Date().toISOString()
 });
 if(ins.error)throw ins.error;
}

f.addEventListener("submit",async function(e){
 e.preventDefault();
 var p={email:f.email.value.trim().toLowerCase(),name:f.name.value.trim(),tiktok:f.tiktok.value.trim(),youtube:f.youtube.value.trim(),facebook:f.facebook.value.trim(),instagram:f.instagram.value.trim(),province:f.province.value,img:img};
 var password=f.password.value;
 if(!p.email||!password||!p.name||!p.province){status("กรุณากรอกอีเมล รหัสผ่าน ชื่อ และจังหวัด","err");return}
 if(password.length<6){status("รหัสผ่านต้องมีอย่างน้อย 6 ตัว","err");return}
 submit.disabled=true;submit.textContent="กำลังสมัคร...";
 try{
   var r=await client.auth.signUp({email:p.email,password:password});
   if(r.error)throw r.error;
   if(r.data.session&&r.data.user){
     await createProfile(r.data.user,p);
     localStorage.removeItem("thr_pending_profile");
     status("สมัครสำเร็จ กำลังไปหน้าแก้ไขข้อมูล...","ok");
     setTimeout(function(){location.replace("748203619558.html")},700);
   }else{
     localStorage.setItem("thr_pending_profile",JSON.stringify(p));
     status("สร้างบัญชีแล้ว กรุณายืนยันอีเมลก่อน จากนั้นเข้าสู่ระบบ โปรไฟล์จะถูกสร้างให้อัตโนมัติ","ok");
     setTimeout(function(){location.href="914672305189.html"},1500);
   }
 }catch(err){status("สมัครไม่สำเร็จ: "+err.message,"err")}
 finally{submit.disabled=false;submit.textContent="สมัครและสร้างโปรไฟล์"}
});

<script id="thr-premium-ui-v2-script">
(function(){
  "use strict";
  var reduce=window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ambient decoration */
  if(!document.querySelector(".thr-ambient")){
    var amb=document.createElement("div");
    amb.className="thr-ambient";
    amb.setAttribute("aria-hidden","true");
    amb.innerHTML='<span class="thr-orb a"></span><span class="thr-orb b"></span><span class="thr-orb c"></span>';
    document.body.prepend(amb);
  }

  /* page type */
  if(document.querySelector("svg.map")) document.body.classList.add("thr-index-page");

  /* smooth page reveal */
  requestAnimationFrame(function(){
    document.body.classList.add("thr-ready");
  });

  /* element reveal - ไม่มีเอฟเฟกต์ตามเมาส์ */
  var nodes=[].slice.call(document.querySelectorAll(
    "main > h1, main > .lead, .card, .account-card, #profile, .music-box, .back, .logo"
  ));

  if("IntersectionObserver" in window && !reduce){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add("thr-in-v2");
          io.unobserve(entry.target);
        }
      });
    },{threshold:.08,rootMargin:"0px 0px -18px 0px"});

    nodes.forEach(function(el,i){
      if(el.id==="profile" && el.hidden) return;
      el.classList.add("thr-reveal-v2");
      el.style.transitionDelay=Math.min(i*45,220)+"ms";
      io.observe(el);
    });
  }else{
    nodes.forEach(function(el){el.classList.add("thr-in-v2")});
  }

  /* micro-feedback แบบไม่สร้างวง ripple / ไม่ตาม cursor */
  document.addEventListener("pointerdown",function(e){
    var el=e.target.closest && e.target.closest("button,.pick,.music-pick,.join-link,#profile-links a");
    if(!el || el.disabled) return;
    el.classList.remove("thr-press-v2");
    void el.offsetWidth;
    el.classList.add("thr-press-v2");
    setTimeout(function(){el.classList.remove("thr-press-v2")},180);
  },{passive:true});

  /* profile ที่ถูกเปิดภายหลัง ให้ reveal ทันทีโดยไม่รบกวน logic เดิม */
  var profile=document.getElementById("profile");
  if(profile && "MutationObserver" in window){
    new MutationObserver(function(){
      if(!profile.hidden){
        profile.classList.remove("thr-reveal-v2");
        profile.classList.add("thr-in-v2");
      }
    }).observe(profile,{attributes:true,attributeFilter:["hidden"]});
  }
})();
</script>
