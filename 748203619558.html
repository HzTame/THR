<!DOCTYPE html><html lang="th"><head><meta name="robots" content="noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Edit THR Profile</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<style>
:root{--ink:#050509;--ember:#c9743a;--glow:#f2c48a;--mist:#8f8aa3;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% 108%,#3a1e16 0%,#1a1224 38%,var(--ink) 75%);color:#e9e4ef;font-family:"Inter","Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;width:min(100%,560px);margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px max(48px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
h1{margin:0;font-size:clamp(1.8rem,7vw,2.5rem);font-weight:300}
.logout{width:auto;background:transparent;color:var(--glow);border:1px solid rgba(242,196,138,.35);padding:9px 12px}
.lead{color:var(--mist);line-height:1.6;margin:0 0 24px}
.card{padding:22px;border:1px solid rgba(242,196,138,.25);border-radius:22px;background:linear-gradient(180deg,rgba(25,18,32,.9),rgba(8,7,14,.94));box-shadow:0 16px 48px rgba(0,0,0,.48)}
form{display:grid;gap:16px}
label{display:block;font-size:.8rem;color:var(--glow);margin-bottom:6px}
label small{color:var(--mist)}
input,select{width:100%;font:inherit;color:#e9e4ef;background:rgba(11,10,20,.82);border:1px solid rgba(201,116,58,.45);border-radius:9px;padding:12px 14px;outline:none}
input:focus,select:focus{border-color:var(--glow);box-shadow:0 0 0 3px rgba(242,196,138,.16)}
select{appearance:none}
.up{display:flex;align-items:center;gap:14px}
#prev,#ph{width:82px;height:82px;border-radius:50%;flex:none}
#prev{object-fit:cover;border:2px solid rgba(242,196,138,.6)}
#ph{display:grid;place-items:center;border:1px dashed rgba(201,116,58,.6);color:var(--mist);font-size:1.5rem}
#prev[hidden],#ph[hidden],#rm[hidden]{display:none}
#photo{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pick{display:inline-block;color:var(--glow);border:1px solid var(--ember);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:.86rem}
#rm{width:auto;margin-left:6px;background:transparent;color:var(--mist);border:0;padding:8px}
button{font:inherit;font-weight:500;color:#171018;background:linear-gradient(135deg,var(--glow),var(--ember));border:0;border-radius:9px;padding:12px 16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.4em;margin:4px 0 0;color:var(--glow);font-size:.85rem}
#msg.err{color:#ff9a9a}.back{display:inline-block;margin-top:18px;color:var(--mist);text-decoration:none}.back:hover{color:var(--glow)}
@media(max-width:420px){main{padding-left:12px;padding-right:12px}.card{padding:16px;border-radius:18px}.top{align-items:flex-start}.logout{padding:8px 10px;font-size:.82rem}}
</style>
<style id="account-settings-style">
.account-card{
  margin-top:18px;
  padding:22px;
  border:1px solid rgba(242,196,138,.25);
  border-radius:22px;
  background:linear-gradient(180deg,rgba(25,18,32,.9),rgba(8,7,14,.94));
  box-shadow:0 16px 48px rgba(0,0,0,.34);
}
.account-card h2{
  margin:0 0 6px;
  font-size:1.2rem;
  font-weight:400;
  color:var(--glow);
}
.account-card .account-lead{
  margin:0 0 18px;
  color:var(--mist);
  font-size:.86rem;
  line-height:1.5;
}
.account-grid{display:grid;gap:16px}
.account-current{
  padding:10px 12px;
  border:1px solid rgba(242,196,138,.18);
  border-radius:9px;
  background:rgba(255,255,255,.025);
  color:#e9e4ef;
  overflow-wrap:anywhere;
}
.account-actions-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:end;
}
.account-actions-row .grow{min-width:0}
.account-actions-row button{
  white-space:nowrap;
  min-width:118px;
}
#email-msg,#password-msg{
  min-height:1.3em;
  margin:6px 0 0;
  font-size:.82rem;
  color:var(--glow);
  line-height:1.45;
}
#email-msg.err,#password-msg.err{color:#ff9a9a}
#email-msg.ok,#password-msg.ok{color:#b6e3b8}
@media(max-width:520px){
  .account-card{padding:16px;border-radius:18px}
  .account-actions-row{grid-template-columns:1fr}
  .account-actions-row button{width:100%}
}
</style>
<style id="password-toggle-style">
.password-field{position:relative}
.password-field input{padding-right:48px}
.password-toggle{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  padding:0;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--glow);
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:18px;
  line-height:1;
}
.password-toggle:hover{background:rgba(242,196,138,.10)}
.password-toggle:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.password-toggle .eye-off{display:none}
.password-toggle.showing .eye{display:none}
.password-toggle.showing .eye-off{display:inline}
</style>
<style id="profile-music-edit-style">
.music-box{
  padding:16px;
  border:1px solid rgba(242,196,138,.18);
  border-radius:14px;
  background:rgba(255,255,255,.025);
}
.music-box h3{
  margin:0 0 6px;
  color:var(--glow);
  font-size:1rem;
  font-weight:500;
}
.music-box .music-help{
  margin:0 0 14px;
  color:var(--mist);
  font-size:.78rem;
  line-height:1.55;
}
.music-choice{display:grid;gap:12px}
.music-upload-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#music-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.music-pick{
  display:inline-block;
  margin:0;
  padding:9px 12px;
  border:1px solid var(--ember);
  border-radius:8px;
  color:var(--glow);
  cursor:pointer;
  font-size:.84rem;
}
#music-file-name{color:var(--mist);font-size:.78rem;overflow-wrap:anywhere}
#remove-music{
  width:auto;
  padding:7px 9px;
  background:transparent;
  color:#ffb0b0;
  border:1px solid rgba(255,154,154,.25);
}
#remove-music[hidden]{display:none!important}
#music-preview{
  margin-top:12px;
  width:100%;
}
#music-preview[hidden]{display:none!important}
#music-preview iframe{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:12px;
  background:#000;
}
#music-preview audio{width:100%}
.music-or{
  text-align:center;
  color:var(--mist);
  font-size:.72rem;
  position:relative;
}
.music-or:before,.music-or:after{
  content:"";
  display:inline-block;
  width:28%;
  height:1px;
  margin:0 8px 3px;
  background:rgba(242,196,138,.16);
}
@media(max-width:420px){
  .music-box{padding:13px}
}
</style>
<style id="password-eye-position-fix">
.password-field{
  position:relative!important;
  width:100%;
}
.password-field input{
  width:100%!important;
  padding-right:48px!important;
}
.account-actions-row .password-field .password-toggle,
.password-field .password-toggle{
  position:absolute!important;
  top:50%!important;
  right:8px!important;
  left:auto!important;
  transform:translateY(-50%)!important;
  width:36px!important;
  min-width:36px!important;
  max-width:36px!important;
  height:36px!important;
  padding:0!important;
  margin:0!important;
  border:0!important;
  border-radius:8px!important;
  background:transparent!important;
  color:var(--glow)!important;
  display:grid!important;
  place-items:center!important;
  box-shadow:none!important;
  z-index:5!important;
}
.account-actions-row .password-field .password-toggle:hover,
.password-field .password-toggle:hover{
  background:rgba(242,196,138,.10)!important;
}
@media(max-width:520px){
  .account-actions-row .password-field .password-toggle,
  .password-field .password-toggle{
    width:36px!important;
    min-width:36px!important;
    max-width:36px!important;
  }
}
</style>

<style id="thr-premium-ui-v2">
:root{
  --thr-gold:#f2c48a;
  --thr-copper:#c9743a;
  --thr-cream:#ffe0b5;
  --thr-violet:#24152e;
  --thr-deep:#050509;
  --thr-ease:cubic-bezier(.16,1,.3,1);
}

/* ---------- ambient background ---------- */
.thr-ambient{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:-1;
}
.thr-orb{
  position:absolute;
  border-radius:50%;
  filter:blur(42px);
  opacity:.13;
  will-change:transform;
}
.thr-orb.a{
  width:min(48vw,520px);height:min(48vw,520px);
  left:-10vw;top:-12vh;
  background:radial-gradient(circle,var(--thr-gold),transparent 68%);
  animation:thrOrbA 16s ease-in-out infinite alternate;
}
.thr-orb.b{
  width:min(55vw,620px);height:min(55vw,620px);
  right:-16vw;bottom:-18vh;
  background:radial-gradient(circle,var(--thr-copper),transparent 68%);
  animation:thrOrbB 19s ease-in-out infinite alternate;
}
.thr-orb.c{
  width:min(34vw,400px);height:min(34vw,400px);
  left:42%;top:38%;
  background:radial-gradient(circle,#8c5a9b,transparent 70%);
  opacity:.07;
  animation:thrOrbC 22s ease-in-out infinite alternate;
}
@keyframes thrOrbA{to{transform:translate3d(9vw,6vh,0) scale(1.12)}}
@keyframes thrOrbB{to{transform:translate3d(-8vw,-5vh,0) scale(.92)}}
@keyframes thrOrbC{to{transform:translate3d(-7vw,8vh,0) scale(1.16)}}

/* ---------- page entrance ---------- */
body{opacity:0;transition:opacity .42s var(--thr-ease)}
body.thr-ready{opacity:1}
main,.wrap{position:relative;z-index:1}

/* ---------- glass / premium surfaces ---------- */
.card,.account-card,#profile,.music-box{
  position:relative;
  isolation:isolate;
  border-color:rgba(242,196,138,.28)!important;
  background:
    linear-gradient(180deg,rgba(31,22,40,.86),rgba(8,7,14,.91))!important;
  box-shadow:
    0 22px 70px rgba(0,0,0,.42),
    inset 0 1px 0 rgba(255,255,255,.07),
    0 0 0 1px rgba(242,196,138,.025)!important;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.card::before,.account-card::before,.music-box::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(135deg,
    rgba(255,224,181,.42),
    rgba(201,116,58,.10) 35%,
    transparent 58%,
    rgba(242,196,138,.18));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  opacity:.55;
}
.card::after,.account-card::after,.music-box::after{
  content:"";
  position:absolute;
  left:10%;right:10%;top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,224,181,.72),transparent);
  pointer-events:none;
  opacity:.55;
}

/* ---------- typography ---------- */
h1{
  text-shadow:0 0 28px rgba(242,196,138,.10);
}
body:not(.thr-index-page) h1{
  background:linear-gradient(100deg,#fff 0%,var(--thr-cream) 46%,#d79a6a 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  letter-spacing:-.025em;
}
.lead{
  letter-spacing:.005em;
}

/* ---------- inputs ---------- */
input,select{
  transition:
    border-color .18s ease,
    box-shadow .18s ease,
    background-color .18s ease,
    transform .18s var(--thr-ease)!important;
  background-color:rgba(9,8,16,.70)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
input:hover,select:hover{
  border-color:rgba(242,196,138,.62)!important;
}
input:focus,select:focus{
  transform:translateY(-1px);
  border-color:rgba(255,224,181,.96)!important;
  box-shadow:
    0 0 0 3px rgba(242,196,138,.10),
    0 8px 22px rgba(0,0,0,.18)!important;
}
label{
  transition:color .18s ease,text-shadow .18s ease,transform .18s ease;
}
div:focus-within>label{
  color:var(--thr-cream)!important;
  text-shadow:0 0 18px rgba(242,196,138,.18);
}

/* ---------- buttons / links ---------- */
button,.pick,.music-pick,.join-link,.back,.signup a,.login-note a,#profile-links a{
  -webkit-tap-highlight-color:transparent;
}
button,.pick,.music-pick,.join-link,#profile-links a{
  position:relative;
  overflow:hidden;
  transition:
    transform .18s var(--thr-ease),
    box-shadow .18s ease,
    filter .18s ease,
    border-color .18s ease,
    background-color .18s ease!important;
}
button::after,.pick::after,.music-pick::after,.join-link::after,#profile-links a::after{
  content:"";
  position:absolute;
  top:-60%;bottom:-60%;
  left:-42%;
  width:24%;
  transform:skewX(-18deg) translateX(-260%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent);
  pointer-events:none;
  opacity:0;
}
@media(hover:hover) and (pointer:fine){
  button:not(:disabled):hover,.pick:hover,.music-pick:hover,.join-link:hover,#profile-links a:hover{
    transform:translateY(-2px);
    filter:brightness(1.05);
  }
  button:hover::after,.pick:hover::after,.music-pick:hover::after,.join-link:hover::after,#profile-links a:hover::after{
    opacity:1;
    animation:thrSweep .72s var(--thr-ease);
  }
}
@keyframes thrSweep{
  from{transform:skewX(-18deg) translateX(-260%)}
  to{transform:skewX(-18deg) translateX(720%)}
}
button:not(:disabled):active,.pick:active,.music-pick:active,.join-link:active,#profile-links a:active{
  transform:translateY(0) scale(.975)!important;
}

/* ---------- reveal ---------- */
.thr-reveal-v2{
  opacity:0;
  transform:translate3d(0,14px,0) scale(.988);
  filter:blur(4px);
}
.thr-reveal-v2.thr-in-v2{
  opacity:1;
  transform:none;
  filter:none;
  transition:
    opacity .58s var(--thr-ease),
    transform .58s var(--thr-ease),
    filter .58s var(--thr-ease);
}

/* ---------- login ---------- */
.logo{
  position:relative;
  box-shadow:
    0 0 0 1px rgba(242,196,138,.12),
    0 0 30px rgba(201,116,58,.10);
  animation:thrLogoFloat 4.8s ease-in-out infinite;
}
.logo::after{
  content:"";
  position:absolute;
  inset:-7px;
  border-radius:50%;
  border:1px solid rgba(242,196,138,.12);
  animation:thrRing 3.8s ease-in-out infinite;
}
@keyframes thrLogoFloat{50%{transform:translateY(-4px)}}
@keyframes thrRing{50%{transform:scale(1.08);opacity:.25}}

/* ---------- upload avatar ---------- */
#prev,#ph{
  transition:transform .28s var(--thr-ease),box-shadow .28s ease,border-color .28s ease;
}
#prev:hover,#ph:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(0,0,0,.28),0 0 22px rgba(242,196,138,.12);
}

/* ---------- status messages ---------- */
#msg,#email-msg,#password-msg{
  transition:opacity .18s ease,transform .18s var(--thr-ease);
}

/* ---------- index page ---------- */
body.thr-index-page h1{
  background:linear-gradient(90deg,#fff 0%,#ffe0b5 36%,#d38b59 66%,#fff 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:thrTitleGlow 8s linear infinite;
}
@keyframes thrTitleGlow{to{background-position:-220% 0}}

body.thr-index-page .land{
  filter:drop-shadow(0 0 8px rgba(242,196,138,.28));
  animation:
    draw 3.2s ease-out forwards,
    thrMapBreath 5.8s ease-in-out 3.2s infinite;
}
@keyframes thrMapBreath{
  50%{filter:drop-shadow(0 0 14px rgba(242,196,138,.42))}
}

body.thr-index-page .member-marker{
  transition:filter .18s ease,opacity .18s ease!important;
}
@media(hover:hover) and (pointer:fine){
  body.thr-index-page .member-marker:hover{
    filter:drop-shadow(0 0 9px rgba(255,224,181,.88)) brightness(1.18)!important;
  }
}
body.thr-index-page #profile{
  box-shadow:
    0 22px 64px rgba(0,0,0,.52),
    0 0 44px rgba(201,116,58,.14),
    inset 0 1px 0 rgba(255,255,255,.08)!important;
}
body.thr-index-page #profile-photo{
  will-change:transform;
}
body.thr-index-page #profile:not([hidden]) #profile-photo{
  animation:
    glowpulse 3.6s ease-in-out infinite,
    thrAvatarFloat 5.4s ease-in-out infinite;
}
@keyframes thrAvatarFloat{50%{transform:translateY(-4px)}}

.thr-menu-button{
  transition:transform .2s var(--thr-ease),box-shadow .2s ease,background .2s ease!important;
  animation:thrMenuBreath 4.6s ease-in-out infinite;
}
@keyframes thrMenuBreath{
  50%{box-shadow:0 8px 30px rgba(0,0,0,.36),0 0 16px rgba(242,196,138,.10)}
}
.thr-menu-panel{
  box-shadow:0 22px 60px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.05)!important;
}

#unique-visitor-count{
  transition:transform .2s var(--thr-ease),border-color .2s ease,background .2s ease;
}
@media(hover:hover) and (pointer:fine){
  #unique-visitor-count:hover{
    transform:translateY(-2px);
    border-color:rgba(242,196,138,.46);
    background:rgba(5,5,9,.74);
  }
}

/* ---------- decorative section pulse on edit page ---------- */
.account-card h2,.music-box h3{
  letter-spacing:.04em;
}
.account-card h2::after,.music-box h3::after{
  content:"";
  display:block;
  width:34px;
  height:1px;
  margin-top:8px;
  background:linear-gradient(90deg,var(--thr-gold),transparent);
}

/* ---------- mobile ---------- */
@media(max-width:520px){
  .thr-orb{filter:blur(34px)}
  .card,.account-card,#profile,.music-box{
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  button,.pick,.music-pick{
    min-height:40px;
  }
}

/* ---------- reduced motion ---------- */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto!important}
  body{opacity:1!important}
  .thr-orb,.logo,.logo::after,
  body.thr-index-page h1,
  body.thr-index-page .land,
  body.thr-index-page #profile-photo,
  .thr-menu-button{
    animation:none!important;
  }
  .thr-reveal-v2{
    opacity:1!important;
    transform:none!important;
    filter:none!important;
  }
  *,*::before,*::after{
    scroll-behavior:auto!important;
  }
}
</style>


<style id="thr-premium-press-style">
.thr-press-v2{transform:scale(.975)!important}
</style>

function setAccountMessage(el,text,type){

async function refreshAccountEmail(){
  var emailBox=document.getElementById("current-email");
  if(!emailBox)return;
  try{
    var result=await client.auth.getUser();
    var user=result.data&&result.data.user;
    emailBox.textContent=user&&user.email?user.email:"ไม่พบอีเมล";
  }catch(e){
    emailBox.textContent="โหลดอีเมลไม่สำเร็จ";
  }
}

document.getElementById("change-email").addEventListener("click",async function(){
  var button=this;
  var input=document.getElementById("new-email");
  var msgEl=document.getElementById("email-msg");
  var newEmail=input.value.trim().toLowerCase();

  setAccountMessage(msgEl,"","");
  if(!newEmail){
    setAccountMessage(msgEl,"กรุณากรอกอีเมลใหม่","err");
    return;
  }

  var userResult=await client.auth.getUser();
  var current=userResult.data&&userResult.data.user;
  if(current&&current.email&&current.email.toLowerCase()===newEmail){
    setAccountMessage(msgEl,"อีเมลใหม่นี้เหมือนกับอีเมลปัจจุบัน","err");
    return;
  }

  button.disabled=true;
  button.textContent="กำลังเปลี่ยน...";
  try{
    var result=await client.auth.updateUser({email:newEmail});
    if(result.error)throw result.error;

    /*
      ถ้า Supabase เปิด Secure email change / Confirm email:
      การเปลี่ยนอีเมลอาจต้องยืนยันผ่านอีเมลก่อน จึงยังไม่เปลี่ยนทันที
    */
    setAccountMessage(
      msgEl,
      "ส่งคำขอเปลี่ยนอีเมลแล้ว หากโปรเจกต์เปิดการยืนยันอีเมล กรุณาตรวจอีเมลและกดยืนยันก่อน",
      "ok"
    );
    input.value="";
    await refreshAccountEmail();
  }catch(err){
    setAccountMessage(msgEl,"เปลี่ยนอีเมลไม่สำเร็จ: "+err.message,"err");
  }finally{
    button.disabled=false;
    button.textContent="เปลี่ยนอีเมล";
  }
});

function size(){cv.width=innerWidth;cv.height=innerHeight;S=[];for(var i=0;i<110;i++)S.push([Math.random()*cv.width,Math.random()*cv.height,Math.random()*1.1+.2,Math.random()*6])}

size();addEventListener("resize",size);requestAnimationFrame(draw);

    var input=document.getElementById(button.dataset.target);
    if(!input)return;
    var show=input.type==="password";
    input.type=show?"text":"password";
    button.classList.toggle("showing",show);
    button.setAttribute("aria-label",show?"ซ่อนรหัสผ่าน":"แสดงรหัสผ่าน");
  });
});
</script>

<script id="thr-premium-ui-v2-script">
(function(){
  "use strict";
  var reduce=window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ambient decoration */
  if(!document.querySelector(".thr-ambient")){
    var amb=document.createElement("div");
    amb.className="thr-ambient";
    amb.setAttribute("aria-hidden","true");
    amb.innerHTML='<span class="thr-orb a"></span><span class="thr-orb b"></span><span class="thr-orb c"></span>';
    document.body.prepend(amb);
  }

  /* page type */
  if(document.querySelector("svg.map")) document.body.classList.add("thr-index-page");

  /* smooth page reveal */
  requestAnimationFrame(function(){
    document.body.classList.add("thr-ready");
  });

  /* element reveal - ไม่มีเอฟเฟกต์ตามเมาส์ */
  var nodes=[].slice.call(document.querySelectorAll(
    "main > h1, main > .lead, .card, .account-card, #profile, .music-box, .back, .logo"
  ));

  if("IntersectionObserver" in window && !reduce){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add("thr-in-v2");
          io.unobserve(entry.target);
        }
      });
    },{threshold:.08,rootMargin:"0px 0px -18px 0px"});

    nodes.forEach(function(el,i){
      if(el.id==="profile" && el.hidden) return;
      el.classList.add("thr-reveal-v2");
      el.style.transitionDelay=Math.min(i*45,220)+"ms";
      io.observe(el);
    });
  }else{
    nodes.forEach(function(el){el.classList.add("thr-in-v2")});
  }

  /* micro-feedback แบบไม่สร้างวง ripple / ไม่ตาม cursor */
  document.addEventListener("pointerdown",function(e){
    var el=e.target.closest && e.target.closest("button,.pick,.music-pick,.join-link,#profile-links a");
    if(!el || el.disabled) return;
    el.classList.remove("thr-press-v2");
    void el.offsetWidth;
    el.classList.add("thr-press-v2");
    setTimeout(function(){el.classList.remove("thr-press-v2")},180);
  },{passive:true});

  /* profile ที่ถูกเปิดภายหลัง ให้ reveal ทันทีโดยไม่รบกวน logic เดิม */
  var profile=document.getElementById("profile");
  if(profile && "MutationObserver" in window){
    new MutationObserver(function(){
      if(!profile.hidden){
        profile.classList.remove("thr-reveal-v2");
        profile.classList.add("thr-in-v2");
      }
    }).observe(profile,{attributes:true,attributeFilter:["hidden"]});
  }
})();
</script>

<script id="thr-source-protection">
(function(){
  "use strict";

  /* กันเมนูคลิกขวา */
  document.addEventListener("contextmenu", function(e){
    e.preventDefault();
  }, {capture:true});

  /* กันคีย์ลัดที่ใช้เปิด source / devtools / save page */
  document.addEventListener("keydown", function(e){
    var k = String(e.key || "").toLowerCase();

    var blocked =
      e.key === "F12" ||
      (e.ctrlKey && k === "u") ||
      (e.ctrlKey && k === "s") ||
      (e.ctrlKey && e.shiftKey && ["i","j","c","k","e"].includes(k)) ||
      (e.metaKey && e.altKey && ["i","j","c"].includes(k));

    if(blocked){
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, true);

  /* ลดการลาก/คัดลอกโค้ดจากหน้าเว็บ */
  document.addEventListener("dragstart", function(e){
    if(e.target && e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA"){
      e.preventDefault();
    }
  }, true);
})();
</script>
