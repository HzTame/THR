<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THR | SKU</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
:root{--ink:#050509;--gold:#f2c48a;--copper:#c9743a;--cream:#ffe0b5;--mist:#aaa4bc;--line:rgba(242,196,138,.32)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% 108%,#3a1e16 0,#1a1224 38%,var(--ink) 75%) fixed;color:#eee9f5;font-family:Inter,Arial,sans-serif}
.shell{width:min(860px,100%);margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 18px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:300;font-size:clamp(2rem,5vw,3rem);background:linear-gradient(100deg,#fff,var(--cream),#d79a6a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mist);line-height:1.6;margin:.4em 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
a.btn,button{font:inherit;font-weight:500;color:#171018;background:linear-gradient(135deg,var(--gold),var(--copper));border:0;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;transition:box-shadow .2s}
button:hover:not(:disabled),a.btn:hover{box-shadow:0 10px 30px rgba(201,116,58,.42)}
button:disabled{opacity:.55;cursor:wait}
.ghost{color:var(--gold)!important;background:rgba(10,8,16,.58)!important;border:1px solid rgba(242,196,138,.34)!important}
a.btn.ghost:hover{border-color:var(--gold)!important;box-shadow:0 0 18px rgba(242,196,138,.18)}
.danger{background:0 0;color:#ffb0b0;border:1px solid rgba(255,154,154,.5);padding:6px 10px;font-size:.8rem}
.status{min-height:1.5em;color:var(--gold);font-size:.9rem;margin:14px 0 6px}
.status.err{color:#ff9a9a}.status.ok{color:#b6e3b8}
.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(31,22,40,.9),rgba(8,7,14,.94));padding:18px}

/* locked gate */
.lock{text-align:center;padding:42px 22px}
.lock .icon{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;color:var(--gold);border:1px solid var(--gold);background:rgba(242,196,138,.07);box-shadow:0 0 30px rgba(242,196,138,.2);position:relative}
.lock .icon::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1px solid var(--gold);animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.lock h2{margin:0 0 8px;font-weight:400;color:var(--cream);font-size:1.4rem}
.lock p{margin:6px 0;color:var(--mist);line-height:1.7}
.big{font-size:2.6rem;font-weight:300;color:var(--cream);margin:10px 0 0}
.digits{display:flex;justify-content:center;gap:10px;margin:14px 0 0;flex-wrap:wrap}
.digits div{min-width:68px;padding:10px 8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04)}
.digits b{display:block;font-size:2rem;font-weight:300;color:var(--cream);font-variant-numeric:tabular-nums}
.digits small{color:var(--mist);font-size:.72rem}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;max-width:420px;margin:18px auto 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--copper),var(--gold),var(--cream));border-radius:99px;transition:width 1s cubic-bezier(.16,1,.3,1);box-shadow:0 0 12px rgba(242,196,138,.6)}

/* composer */
.composer{display:grid;gap:10px;margin:18px 0}
.composer h3{margin:0;font-weight:500;color:var(--gold);font-size:1rem}
input[type=text],textarea{width:100%;font:inherit;font-size:.92rem;color:#eee9f5;background:rgba(9,8,16,.76);border:1px solid rgba(201,116,58,.45);border-radius:10px;padding:10px 12px;outline:0}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{border-color:var(--cream);box-shadow:0 0 0 3px rgba(242,196,138,.13)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.file{color:var(--mist);font-size:.82rem}

/* posts */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stats span{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--mist)}
.stats b{color:var(--cream)}
.feed{display:grid;gap:14px;margin-top:10px}
.post h3{margin:0 0 4px;font-weight:500;color:#fff;font-size:1.1rem;overflow-wrap:anywhere}
.meta{font-size:.78rem;color:var(--mist);margin-bottom:10px}
.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:.93rem}
.post img{display:block;max-width:100%;max-height:420px;margin-top:12px;border-radius:12px;border:1px solid var(--line)}
.post .foot{display:flex;justify-content:flex-end;margin-top:10px}
.empty{padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--mist);text-align:center}
.badge{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;font-size:.7rem;color:#171018;background:linear-gradient(135deg,var(--gold),var(--copper))}

/* settings */
.sett h3{margin:0 0 4px;font-weight:500;color:var(--gold);font-size:1rem}
.sett p.hint{margin:0 0 12px;color:var(--mist);font-size:.84rem;line-height:1.6}
.sett .srow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{font:inherit;font-size:.92rem;color:#eee9f5;background:rgba(9,8,16,.76);border:1px solid rgba(201,116,58,.45);border-radius:10px;padding:10px 12px;outline:0;min-width:170px}
select:focus{border-color:var(--cream);box-shadow:0 0 0 3px rgba(242,196,138,.13)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
.sum span{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--mist)}
.sum b{color:var(--cream)}
.roster{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.rrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid rgba(242,196,138,.1);font-size:.88rem}
.rrow:last-child{border-bottom:0}
.rrow small{color:var(--mist)}
.ok{color:#b6e3b8}.no{color:#ffb0b0}
.snote{margin:10px 0 0;color:#ff9a9a;font-size:.82rem;min-height:1em}
.body a{color:var(--gold);text-decoration:underline;word-break:break-all}.body a:hover{color:var(--cream)}
.top{gap:10px 16px;align-items:center;flex-wrap:nowrap}
.top>div:first-child{min-width:0}
h1{line-height:1.1}
.lead{margin:.2em 0 0;font-size:.9rem}
.status{margin:8px 0 4px}
.actions{flex-wrap:nowrap;justify-content:flex-end;flex:none}
a.btn,button{white-space:nowrap}
@media(max-width:760px){.top{flex-wrap:wrap}.actions{flex-wrap:wrap;justify-content:flex-start;flex:1 1 100%}}
.post .foot{align-items:center;gap:8px}
.pdays{display:inline-flex;align-items:center;gap:6px;color:var(--mist);font-size:.78rem}
.pdays select{min-width:0;font-size:.8rem;padding:5px 8px;border-radius:8px;color:var(--gold);background:rgba(10,8,16,.58);border:1px solid rgba(242,196,138,.34)}
.pdays select:disabled{opacity:.55}
.composer .pdays{font-size:.85rem}
.composer .pdays select{font-size:.88rem;padding:8px 10px}
.tabs{display:flex;gap:8px;margin:14px 0 0}
.tabs button.on{border-color:var(--gold)!important;box-shadow:0 0 18px rgba(242,196,138,.18)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
input[type=search]{flex:1;min-width:200px;font:inherit;font-size:.92rem;color:#eee9f5;background:rgba(9,8,16,.76);border:1px solid rgba(201,116,58,.45);border-radius:10px;padding:10px 12px;outline:0}
input[type=search]:focus{border-color:var(--cream);box-shadow:0 0 0 3px rgba(242,196,138,.13)}
.count{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--mist);white-space:nowrap}
.count b{color:var(--cream)}
.acts{display:flex;gap:8px}
button.sm{padding:6px 10px;font-size:.8rem}
.post p{margin:12px 0 0}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div>
      <h1>SKU</h1>
      <p class="lead" id="lead">กำลังโหลด...</p>
    </div>
    <nav class="actions">
      <a class="btn ghost" href="index.html">หน้าหลัก</a>
      <a class="btn ghost" href="389554462347.html">โปรไฟล์</a>
      <a class="btn ghost" href="111908932517.html">องค์กร</a>
      <a class="btn ghost" href="739150284613.html">WH</a>
      <button id="refresh" type="button">รีเฟรช</button>
    </nav>
  </header>

  <p id="msg" class="status" aria-live="polite">กำลังตรวจสอบสิทธิ์...</p>
  <div id="app"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL="https://gxurnxlbtmdymrdfrhcv.supabase.co",
    SUPABASE_ANON_KEY="sb_publishable_QKnPZU1huLddOAYWOP4KPA_29Sv7C7G",
    client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),
    me=null,profile=null,isAdmin=false,
    msg=document.getElementById("msg"),app=document.getElementById("app");

function esc(e){return String(e==null?"":e).replace(/[&<>'"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]})}
function linkify(t){
  return esc(t).replace(/https?:\/\/[^\s]+/g,function(u){
    var cut=u.search(/&quot;|&#39;|&lt;|&gt;/);var rest="";
    if(cut>-1){rest=u.slice(cut);u=u.slice(0,cut)}
    var m=u.match(/[.,;:!?)\]]+$/);if(m){rest=m[0]+rest;u=u.slice(0,-m[0].length)}
    return u?'<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'+rest:rest;
  });
}
function status(t,c){msg.textContent=t;msg.className="status "+(c||"")}
function fdate(e){return e?new Date(e).toLocaleString("th-TH"):"-"}
function p2(n){return String(n).padStart(2,"0")}
function fday(e){if(!e)return"-";var d=new Date(e);return p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+(d.getFullYear()+543)}

var OPTS=[[1,"1 วัน"],[3,"3 วัน"],[7,"7 วัน"],[14,"14 วัน"],[30,"1 เดือน"],[60,"2 เดือน"],[90,"3 เดือน"],[120,"4 เดือน"],[150,"5 เดือน"],[180,"6 เดือน"],[210,"7 เดือน"],[240,"8 เดือน"],[270,"9 เดือน"],[300,"10 เดือน"],[330,"11 เดือน"],[365,"1 ปี"]];
var minDays=30,savedDays=30,roster=[];
function dayLabel(d){var o=OPTS.filter(function(x){return x[0]===d})[0];return o?o[1]:d+" วัน"}
function postDaysOpts(cur,defLabel){
  var h='<option value=""'+(cur==null?' selected':'')+'>'+esc(defLabel)+'</option><option value="0"'+(cur===0?' selected':'')+'>เปิดทันที</option>';
  return h+OPTS.map(function(o){return '<option value="'+o[0]+'"'+(cur===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join("");
}
function tenure(m){var s=new Date(m.approved_at||m.created_at);return Math.max(0,Math.floor((Date.now()-s)/864e5))}
function isStaff(m){return m.role==="admin"||m.role==="deputy_admin"}

function fillComposerDays(){
  var el=document.getElementById("p-days");if(!el)return;
  el.innerHTML=postDaysOpts(null,"ค่าเริ่มต้น ("+dayLabel(minDays)+")");
}
function fillSelect(){
  var sel=document.getElementById("s-days");
  sel.innerHTML=OPTS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===minDays?" selected":"")+'>'+o[1]+'</option>'}).join("");
}
function renderRoster(){
  var ok=0,rows=roster.slice().sort(function(a,b){return tenure(b)-tenure(a)}).map(function(m){
    var d=tenure(m),pass=isStaff(m)||d>=minDays;if(pass)ok++;
    return '<div class="rrow"><span>'+esc(m.name||"ไม่ระบุชื่อ")+(isStaff(m)?' <small>(แอดมิน)</small>':'')+'</span>'+
      '<span><small>อยู่มา '+d+' วัน</small> · '+(pass?'<span class="ok">เปิดได้</span>':'<span class="no">ยังไม่ถึง</span>')+'</span></div>';
  }).join("");
  document.getElementById("s-sum").innerHTML='<span>เงื่อนไขปัจจุบัน: <b>'+esc(dayLabel(minDays))+'</b></span>'+
    '<span>เข้าเงื่อนไขแล้ว: <b>'+ok+'</b> / '+roster.length+' คน</span>'+
    (minDays!==savedDays?'<span style="color:var(--gold)">ยังไม่ได้บันทึก</span>':'');
  document.getElementById("s-list").innerHTML=rows||'<div class="rrow"><small>ยังไม่มีสมาชิก</small></div>';
}
async function loadSettings(){
  var note=document.getElementById("s-note");note.textContent="";
  var r=await client.from("channel_settings").select("min_days").eq("id",1).maybeSingle();
  if(r.error){note.textContent="ยังไม่ได้ตั้งค่าระบบ: รันไฟล์ channel_settings.sql ใน Supabase ก่อน ("+r.error.message+")"}
  else if(r.data&&r.data.min_days){minDays=savedDays=r.data.min_days}
  var m=await client.from("members").select("user_id,name,role,approved_at,created_at").eq("status","approved");
  roster=m.data||[];
  fillSelect();renderRoster();fillComposerDays();
}
async function saveSettings(){
  var btn=document.getElementById("s-save"),v=parseInt(document.getElementById("s-days").value,10);
  btn.disabled=true;status("กำลังบันทึก...");
  var r=await client.from("channel_settings").upsert({id:1,min_days:v,updated_by:me.id,updated_at:new Date().toISOString()},{onConflict:"id"});
  btn.disabled=false;
  if(r.error){status("บันทึกไม่สำเร็จ: "+r.error.message,"err");return}
  minDays=savedDays=v;renderRoster();fillComposerDays();if(posts.length)renderPosts();status("บันทึกแล้ว: ต้องอยู่ในทีมครบ "+dayLabel(v),"ok");
}

async function init(){
  var u=await client.auth.getUser();
  if(u.error||!u.data.user){location.replace("index.html");return}
  me=u.data.user;
  var r=await client.from("members").select("name,role,status,approved_at,created_at").eq("user_id",me.id).maybeSingle();
  if(r.error||!r.data||r.data.status!=="approved"){
    status("หน้านี้สำหรับสมาชิกที่ได้รับอนุมัติแล้วเท่านั้น","err");
    setTimeout(function(){location.replace("index.html")},1200);return;
  }
  profile=r.data;
  isAdmin=profile.role==="admin"||profile.role==="deputy_admin";
  document.getElementById("lead").textContent=isAdmin?"Admin เห็นรายการของสมาชิกทุกคน · แก้ไข/ลบได้เฉพาะของตัวเอง":"อัปโหลดได้ · เห็นและแก้ไขได้เฉพาะรายการของคุณ";
  app.innerHTML=(isAdmin?'<div class="tabs"><button class="ghost on" data-tab="sku" type="button">SKU</button><button class="ghost" data-tab="adm" type="button">ประกาศแอดมิน</button></div>':'')+'<div id="tab-sku"></div><div id="tab-adm" style="display:none"></div>';
  status("");renderSku();await loadSku();
  if(isAdmin){renderChannel();await loadSettings();await loadPosts()}
}

function renderChannel(){
  var composer=isAdmin?
   '<section class="card composer">'+
     '<h3>✎ โพสต์ใหม่ (เฉพาะแอดมิน)</h3>'+
     '<input type="text" id="p-title" maxlength="120" placeholder="หัวข้อ">'+
     '<textarea id="p-body" maxlength="4000" placeholder="เขียนข้อความถึงสมาชิก..."></textarea>'+
     '<div class="row"><label class="file">แนบรูป (ไม่บังคับ): <input type="file" id="p-file" accept="image/*"></label>'+
     '<span class="pdays">เปิดดูได้หลังเข้าทีม <select id="p-days"></select></span>'+
     '<button id="p-send" type="button">ส่งข้อความ</button></div>'+
   '</section>':'';
  document.getElementById("tab-adm").innerHTML='<section class="card sett" style="margin-top:18px">'+
     '<h3>⏱ ตั้งเวลาเปิดสิทธิ์ดูโพสต์</h3>'+
     '<p class="hint">นับจากวันที่ได้รับอนุมัติเข้าทีม สมาชิกที่อยู่ครบตามเวลาที่เลือกจะเปิดดูโพสต์ของแอดมินได้ (Admin และรอง Admin เปิดได้เสมอ)</p>'+
     '<div class="srow"><select id="s-days"></select><button id="s-save" type="button">บันทึกการตั้งค่า</button></div>'+
     '<div class="sum" id="s-sum"></div>'+
     '<div class="roster" id="s-list"></div>'+
     '<p class="snote" id="s-note"></p>'+
   '</section>'+composer+'<div id="stats" class="stats"></div><section id="feed" class="feed"></section>';
  if(isAdmin){document.getElementById("p-send").addEventListener("click",publish);fillComposerDays()}
  document.getElementById("s-save").addEventListener("click",saveSettings);
  document.getElementById("s-days").addEventListener("change",function(){minDays=parseInt(this.value,10);renderRoster()});
}

var posts=[],hasPostDays=true;
async function loadPosts(){
  status("กำลังโหลดข้อความ...");
  var r=await client.from("channel_posts").select("id,author_id,author_name,title,body,image_url,created_at,min_days").order("created_at",{ascending:false});
  hasPostDays=!r.error;
  if(r.error)r=await client.from("channel_posts").select("id,author_id,author_name,title,body,image_url,created_at").order("created_at",{ascending:false});
  if(r.error){
    status("โหลดข้อความไม่สำเร็จ: "+r.error.message,"err");
    document.getElementById("feed").innerHTML='<div class="empty">กรุณารันไฟล์ SQL (channel_setup.sql) ก่อน หรือคุณยังไม่มีสิทธิ์เปิดช่องนี้</div>';
    return;
  }
  posts=r.data||[];renderPosts();status("โหลดเรียบร้อย","ok");
}

function renderPosts(){
  document.getElementById("stats").innerHTML="<span>ข้อความทั้งหมด: <b>"+posts.length+"</b></span>";
  var feed=document.getElementById("feed");
  if(!posts.length){feed.innerHTML='<div class="empty">ยังไม่มีข้อความจากแอดมิน</div>';return}
  feed.innerHTML=posts.map(function(p){
    var img=/^https:\/\//.test(p.image_url||"")?'<img src="'+esc(p.image_url)+'" alt="">':"";
    var pd=hasPostDays?'<label class="pdays" title="ตั้งว่าสมาชิกต้องอยู่ในทีมกี่วันถึงจะเปิดโพสต์นี้ได้">⏱ เปิดได้หลัง <select data-days="'+esc(p.id)+'">'+postDaysOpts(p.min_days==null?null:Number(p.min_days),"ค่าเริ่มต้น ("+dayLabel(minDays)+")")+'</select></label>':"";
    var del=isAdmin?'<div class="foot">'+pd+'<button class="danger" data-del="'+esc(p.id)+'">ลบ</button></div>':"";
    return '<article class="card post"><h3>'+esc(p.title||"ไม่มีหัวข้อ")+'</h3>'+
      '<div class="meta">โดย '+esc(p.author_name||"Admin")+'<span class="badge">ADMIN</span> · '+esc(fdate(p.created_at))+'</div>'+
      '<div class="body">'+linkify(p.body||"")+'</div>'+img+del+'</article>';
  }).join("");
}

async function publish(){
  var t=document.getElementById("p-title").value.trim(),
      b=document.getElementById("p-body").value.trim(),
      f=document.getElementById("p-file").files[0],
      btn=document.getElementById("p-send");
  if(!t&&!b&&!f){status("กรุณากรอกข้อความหรือแนบรูป","err");return}
  btn.disabled=true;status("กำลังส่ง...");
  var url=null;
  if(f){
    if(f.size>5*1024*1024){status("รูปต้องไม่เกิน 5MB","err");btn.disabled=false;return}
    var ext=(f.name.split(".").pop()||"png").replace(/[^a-z0-9]/gi,"").toLowerCase().slice(0,5)||"png",
        path=me.id+"/"+Date.now()+"."+ext,
        up=await client.storage.from("channel-files").upload(path,f,{contentType:f.type});
    if(up.error){status("อัปโหลดรูปไม่สำเร็จ: "+up.error.message,"err");btn.disabled=false;return}
    url=client.storage.from("channel-files").getPublicUrl(path).data.publicUrl;
  }
  var row={author_id:me.id,author_name:profile.name||"Admin",title:t||null,body:b||null,image_url:url},
      pdv=document.getElementById("p-days").value;
  if(pdv!=="")row.min_days=parseInt(pdv,10);
  var ins=await client.from("channel_posts").insert(row);
  btn.disabled=false;
  if(ins.error){status("ส่งไม่สำเร็จ: "+ins.error.message,"err");return}
  document.getElementById("p-title").value="";document.getElementById("p-body").value="";document.getElementById("p-file").value="";
  await loadPosts();status("ส่งข้อความเรียบร้อย","ok");
}

app.addEventListener("change",async function(e){
  var sel=e.target.closest("[data-days]");if(!sel)return;
  var id=sel.dataset.days,v=sel.value===""?null:parseInt(sel.value,10);
  sel.disabled=true;status("กำลังบันทึกเวลาเปิดโพสต์...");
  var r=await client.from("channel_posts").update({min_days:v}).eq("id",id).select("id");
  sel.disabled=false;
  if(r.error||!(r.data&&r.data.length)){status("บันทึกไม่สำเร็จ"+(r.error?": "+r.error.message:" (ยังไม่มีสิทธิ์แก้ไข รัน channel_post_lock.sql ก่อน)"),"err");return}
  posts.forEach(function(p){if(String(p.id)===String(id))p.min_days=v});
  status(v==null?"ใช้ค่าเริ่มต้นแล้ว":"บันทึกแล้ว: เปิดได้หลังเข้าทีม "+(v===0?"ทันที":dayLabel(v)),"ok");
});
app.addEventListener("click",async function(e){
  var d=e.target.closest("[data-del]");if(!d)return;
  if(!confirm("ยืนยันการลบข้อความนี้?"))return;
  var r=await client.from("channel_posts").delete().eq("id",d.dataset.del).select("id");
  if(r.error||!(r.data&&r.data.length)){status("ลบไม่สำเร็จ"+(r.error?": "+r.error.message:""),"err");return}
  posts=posts.filter(function(p){return String(p.id)!==String(d.dataset.del)});renderPosts();status("ลบเรียบร้อย","ok");
});

/* ===== SKU: ทุกคนอัปโหลดได้ / แก้ไข-ลบได้เฉพาะของตัวเอง / สมาชิกเห็นเฉพาะของตัวเอง / แอดมินเห็นทั้งหมด ===== */
var BUCKET="sku-files",skus=[],urls={},editing=null;
function isImg(t){return /^image\//.test(t||"")}
function renderSku(){
  document.getElementById("tab-sku").innerHTML=
  '<section class="card composer" style="margin-top:18px"><h3>✎ อัปโหลดใหม่</h3>'+
  '<input type="text" id="k-title" maxlength="120" placeholder="หัวข้อ / รหัส SKU">'+
  '<textarea id="k-body" maxlength="4000" placeholder="รายละเอียด..."></textarea>'+
  '<div class="row"><label class="file">แนบไฟล์ (ไม่เกิน 10MB): <input type="file" id="k-file"></label><button id="k-send" type="button">อัปโหลด</button></div></section>'+
  '<div class="tools"><input type="search" id="k-q" placeholder="'+(isAdmin?"ค้นหาหัวข้อ ข้อความ หรือชื่อผู้โพสต์":"ค้นหา")+'"><span class="count">'+(isAdmin?"ทั้งหมด":"ของฉัน")+' <b id="k-n">0</b> รายการ</span></div>'+
  '<section id="k-feed" class="feed"></section>';
  document.getElementById("k-send").addEventListener("click",sendSku);
  document.getElementById("k-q").addEventListener("input",renderSkuFeed);
}
async function loadSku(){
  var r=await client.from("sku_posts").select("*").order("created_at",{ascending:false});
  if(r.error){status("โหลดไม่สำเร็จ: "+r.error.message,"err");document.getElementById("k-feed").innerHTML='<div class="empty">กรุณารันไฟล์ sku_setup.sql ใน Supabase ก่อน</div>';return}
  skus=r.data||[];urls={};
  var paths=skus.filter(function(p){return p.file_path}).map(function(p){return p.file_path});
  if(paths.length){var s=await client.storage.from(BUCKET).createSignedUrls(paths,3600);(s.data||[]).forEach(function(x){if(x.signedUrl)urls[x.path]=x.signedUrl})}
  renderSkuFeed();status("โหลดเรียบร้อย","ok");
}
function renderSkuFeed(){
  var q=(document.getElementById("k-q").value||"").trim().toLowerCase(),
      list=skus.filter(function(p){return !q||((p.title||"")+" "+(p.body||"")+" "+(p.author_name||"")).toLowerCase().indexOf(q)>-1}),
      feed=document.getElementById("k-feed");
  document.getElementById("k-n").textContent=list.length;
  if(!list.length){feed.innerHTML='<div class="empty">'+(skus.length?"ไม่พบรายการที่ค้นหา":"ยังไม่มีรายการ")+'</div>';return}
  feed.innerHTML=list.map(function(p){
    var id=esc(p.id),mine=p.author_id===me.id;
    if(String(editing)===String(p.id)){
      return '<article class="card composer" style="margin:0"><h3>✎ แก้ไขรายการ</h3>'+
        '<input type="text" id="e-title" maxlength="120" value="'+esc(p.title||"")+'">'+
        '<textarea id="e-body" maxlength="4000">'+esc(p.body||"")+'</textarea>'+
        '<div class="row"><label class="file">เปลี่ยนไฟล์ (ไม่บังคับ): <input type="file" id="e-file"></label>'+
        '<span class="acts"><button class="ghost" data-kcancel="1" type="button">ยกเลิก</button><button data-ksave="'+id+'" type="button">บันทึก</button></span></div></article>';
    }
    var u=urls[p.file_path],f="";
    if(p.file_path&&u)f=isImg(p.file_type)?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer"><img src="'+esc(u)+'" alt=""></a>'
      :'<p><a class="btn ghost" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">📎 '+esc(p.file_name||"ไฟล์แนบ")+'</a></p>';
    var foot=mine?'<div class="foot"><button class="ghost sm" data-kedit="'+id+'" type="button">แก้ไข</button><button class="danger" data-kdel="'+id+'" type="button">ลบ</button></div>':"";
    return '<article class="card post"><h3>'+esc(p.title||"ไม่มีหัวข้อ")+'</h3>'+
      '<div class="meta">โดย '+esc(p.author_name||"สมาชิก")+(mine?'<span class="badge">ของคุณ</span>':'')+' · '+esc(fdate(p.created_at))+(p.updated_at?' · แก้ไขแล้ว':'')+'</div>'+
      (p.body?'<div class="body">'+linkify(p.body)+'</div>':'')+f+foot+'</article>';
  }).join("");
}
async function upFile(f){
  if(f.size>10*1024*1024)return{err:"ไฟล์ต้องไม่เกิน 10MB"};
  var ext=(f.name.split(".").pop()||"bin").replace(/[^a-z0-9]/gi,"").toLowerCase().slice(0,8)||"bin",
      path=me.id+"/"+Date.now()+"."+ext,
      up=await client.storage.from(BUCKET).upload(path,f,{contentType:f.type||"application/octet-stream"});
  return up.error?{err:up.error.message}:{path:path,name:f.name,type:f.type||""};
}
async function sendSku(){
  var t=document.getElementById("k-title").value.trim(),b=document.getElementById("k-body").value.trim(),
      f=document.getElementById("k-file").files[0],btn=document.getElementById("k-send");
  if(!t&&!b&&!f){status("กรุณากรอกข้อความหรือแนบไฟล์","err");return}
  btn.disabled=true;status("กำลังอัปโหลด...");
  var row={author_id:me.id,author_name:profile.name||"สมาชิก",title:t||null,body:b||null};
  if(f){var u=await upFile(f);if(u.err){status("อัปโหลดไม่สำเร็จ: "+u.err,"err");btn.disabled=false;return}row.file_path=u.path;row.file_name=u.name;row.file_type=u.type}
  var ins=await client.from("sku_posts").insert(row);
  btn.disabled=false;
  if(ins.error){if(row.file_path)await client.storage.from(BUCKET).remove([row.file_path]);status("บันทึกไม่สำเร็จ: "+ins.error.message,"err");return}
  document.getElementById("k-title").value="";document.getElementById("k-body").value="";document.getElementById("k-file").value="";
  await loadSku();status("อัปโหลดเรียบร้อย","ok");
}
async function saveSku(id){
  var p=skus.filter(function(x){return String(x.id)===String(id)})[0];if(!p)return;
  var upd={title:document.getElementById("e-title").value.trim()||null,body:document.getElementById("e-body").value.trim()||null,updated_at:new Date().toISOString()},
      f=document.getElementById("e-file").files[0],old=null,nu=null;
  status("กำลังบันทึก...");
  if(f){nu=await upFile(f);if(nu.err){status("อัปโหลดไม่สำเร็จ: "+nu.err,"err");return}
    upd.file_path=nu.path;upd.file_name=nu.name;upd.file_type=nu.type;old=p.file_path}
  var r=await client.from("sku_posts").update(upd).eq("id",id).eq("author_id",me.id).select("id");
  if(r.error||!(r.data&&r.data.length)){if(nu)await client.storage.from(BUCKET).remove([nu.path]);status("บันทึกไม่สำเร็จ"+(r.error?": "+r.error.message:" (แก้ไขได้เฉพาะของตัวเอง)"),"err");return}
  if(old)await client.storage.from(BUCKET).remove([old]);
  editing=null;await loadSku();status("บันทึกแล้ว","ok");
}
async function delSku(id){
  if(!confirm("ยืนยันการลบรายการนี้?"))return;
  var p=skus.filter(function(x){return String(x.id)===String(id)})[0];
  var r=await client.from("sku_posts").delete().eq("id",id).eq("author_id",me.id).select("id");
  if(r.error||!(r.data&&r.data.length)){status("ลบไม่สำเร็จ"+(r.error?": "+r.error.message:" (ลบได้เฉพาะของตัวเอง)"),"err");return}
  if(p&&p.file_path)await client.storage.from(BUCKET).remove([p.file_path]);
  await loadSku();status("ลบเรียบร้อย","ok");
}
app.addEventListener("click",function(e){
  var el=e.target.closest("[data-tab]");
  if(el){
    var k=el.dataset.tab;
    document.getElementById("tab-sku").style.display=k==="sku"?"":"none";
    document.getElementById("tab-adm").style.display=k==="adm"?"":"none";
    app.querySelectorAll("[data-tab]").forEach(function(b){b.classList.toggle("on",b===el)});return;
  }
  if(el=e.target.closest("[data-kedit]")){editing=el.dataset.kedit;renderSkuFeed();return}
  if(e.target.closest("[data-kcancel]")){editing=null;renderSkuFeed();return}
  if(el=e.target.closest("[data-ksave]")){saveSku(el.dataset.ksave);return}
  if(el=e.target.closest("[data-kdel]")){delSku(el.dataset.kdel)}
});

document.getElementById("refresh").addEventListener("click",function(){app.innerHTML="";init()});
init();
</script>
</body>
</html>
