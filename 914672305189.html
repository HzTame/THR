<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THR Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<style>

:root{--ink:#050509;--ember:#c9743a;--glow:#f2c48a;--mist:#8f8aa3;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% 108%,#3a1e16 0%,#1a1224 38%,var(--ink) 75%);color:#e9e4ef;font-family:"Inter","Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
input,select{width:100%;font:inherit;color:#e9e4ef;background:rgba(11,10,20,.82);border:1px solid rgba(201,116,58,.45);border-radius:10px;padding:12px 14px;outline:none}
input:focus,select:focus{border-color:var(--glow);box-shadow:0 0 0 3px rgba(242,196,138,.16)}
label{display:block;margin-bottom:6px;color:var(--glow);font-size:.82rem}
label small{color:var(--mist)}
button{font:inherit;font-weight:500;color:#171018;background:linear-gradient(135deg,var(--glow),var(--ember));border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.back{display:block;margin-top:18px;text-align:center;color:var(--mist);text-decoration:none}
.back:hover{color:var(--glow)}

.wrap{position:relative;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
.card{width:min(100%,420px);padding:28px;border:1px solid rgba(242,196,138,.28);border-radius:24px;background:linear-gradient(180deg,rgba(25,18,32,.92),rgba(8,7,14,.95));box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 36px rgba(201,116,58,.12)}
.logo{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(242,196,138,.45);color:var(--glow);font-weight:500;letter-spacing:.08em}
h1{margin:0 0 8px;text-align:center;font-size:2rem;font-weight:300}.lead{text-align:center;color:var(--mist);margin:0 0 24px;line-height:1.6}
.field{margin-bottom:16px}button{width:100%}#msg{min-height:1.4em;margin:12px 0 0;text-align:center;color:var(--glow);font-size:.86rem;line-height:1.45}#msg.err{color:#ff9a9a}
.signup{text-align:center;color:var(--mist);font-size:.86rem;margin-top:14px}.signup a{color:var(--glow)}
@media(max-width:420px){.card{padding:22px 16px;border-radius:20px}h1{font-size:1.7rem}}
</style>

<style id="thr-ultra-smooth-style">
html{scroll-behavior:smooth}
body{--mx:50vw;--my:20vh}
body::before{
  content:"";
  position:fixed;
  left:0;top:0;
  width:280px;height:280px;
  border-radius:50%;
  pointer-events:none;
  z-index:-1;
  opacity:.20;
  background:radial-gradient(circle,rgba(242,196,138,.22) 0%,rgba(201,116,58,.08) 38%,transparent 72%);
  transform:translate3d(calc(var(--mx) - 140px),calc(var(--my) - 140px),0);
  will-change:transform;
}
button,a,input,select,.card,.account-card,#profile,.member,.music-box{
  -webkit-tap-highlight-color:transparent;
}
button,a{
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,filter .18s ease,background-color .18s ease,border-color .18s ease!important;
}
button:not(:disabled):active,a:active{transform:scale(.975)}
input,select{
  transition:border-color .16s ease,box-shadow .16s ease,background-color .16s ease,transform .16s ease!important;
}
input:focus,select:focus{transform:translateZ(0) scale(1.006)}
.card,.account-card,#profile,.music-box{
  transform:translateZ(0);
  backface-visibility:hidden;
  will-change:transform;
}
.thr-reveal{
  opacity:0;
  transform:translate3d(0,18px,0) scale(.985);
}
.thr-reveal.thr-in{
  opacity:1;
  transform:translate3d(0,0,0) scale(1);
  transition:opacity .52s cubic-bezier(.16,1,.3,1),transform .52s cubic-bezier(.16,1,.3,1);
}
.thr-ripple{
  position:fixed;
  width:8px;height:8px;
  margin:-4px 0 0 -4px;
  border-radius:50%;
  pointer-events:none;
  z-index:99999;
  border:1px solid rgba(242,196,138,.75);
  box-shadow:0 0 18px rgba(242,196,138,.35);
  animation:thrRipple .5s ease-out forwards;
}
@keyframes thrRipple{
  to{opacity:0;transform:scale(5)}
}
.thr-shine{
  position:relative;
  overflow:hidden;
}
.thr-shine::after{
  content:"";
  position:absolute;
  inset:-50% auto -50% -40%;
  width:22%;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
  transform:skewX(-18deg) translateX(-220%);
  animation:thrShine 7s ease-in-out infinite;
}
@keyframes thrShine{
  0%,78%{transform:skewX(-18deg) translateX(-220%)}
  92%,100%{transform:skewX(-18deg) translateX(760%)}
}
@media (hover:hover) and (pointer:fine){
  button:not(:disabled):hover,a:hover{transform:translateY(-1px)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  body::before,.thr-shine::after{display:none!important}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>

<style id="thr-form-fx">
input,select{background-image:linear-gradient(90deg,rgba(242,196,138,.03),transparent 35%)}
label{transition:color .16s ease,text-shadow .16s ease}
div:focus-within>label{color:#ffd6a4;text-shadow:0 0 16px rgba(242,196,138,.18)}
.card,.account-card{box-shadow:0 20px 60px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.015) inset!important}
</style>

</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap"><main class="card">
<div class="logo">THR</div><h1>LOGIN</h1><p class="lead">เข้าสู่ระบบเพื่อแก้ไขข้อมูลส่วนตัวของคุณ</p>
<form id="loginForm" novalidate>
<div class="field"><label for="email">อีเมล</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
<div class="field"><label for="password">รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
<button id="loginBtn" type="submit">เข้าสู่ระบบ</button><p id="msg" aria-live="polite"></p>
</form>
<div class="signup">ยังไม่มีบัญชี? <a href="267495831025.html">สมัครสมาชิก THR</a></div>
<a class="back" href="583104927650.html">← กลับหน้าหลัก</a>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL="https://gxurnxlbtmdymrdfrhcv.supabase.co",SUPABASE_ANON_KEY="sb_publishable_QKnPZU1huLddOAYWOP4KPA_29Sv7C7G",BUCKET="member-photos";
var client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
var form=document.getElementById("loginForm"),btn=document.getElementById("loginBtn"),msg=document.getElementById("msg");
function status(t,err){msg.textContent=t;msg.className=err?"err":""}
function dataUrlToBlob(dataUrl){var parts=dataUrl.split(","),mime=parts[0].match(/:(.*?);/)[1],binary=atob(parts[1]),bytes=new Uint8Array(binary.length);for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:mime})}

async function completePending(user){
 var raw=localStorage.getItem("thr_pending_profile");if(!raw)return;
 var p;try{p=JSON.parse(raw)}catch(e){localStorage.removeItem("thr_pending_profile");return}
 if(!p||!p.email||String(p.email).toLowerCase()!==String(user.email||"").toLowerCase())return;
 var existing=await client.from("members").select("id").eq("user_id",user.id).maybeSingle();
 if(existing.error)throw existing.error;
 if(existing.data){localStorage.removeItem("thr_pending_profile");return}
 var photoUrl=null;
 if(p.img){
   var blob=dataUrlToBlob(p.img),path=user.id+"/"+Date.now()+".jpg";
   var up=await client.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg",upsert:false});
   if(up.error)throw up.error;
   photoUrl=client.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
 }
 var ins=await client.from("members").insert({user_id:user.id,name:p.name,tiktok:p.tiktok||null,youtube:p.youtube||null,facebook:p.facebook||null,instagram:p.instagram||null,province:p.province,photo_url:photoUrl,created_at:new Date().toISOString()});
 if(ins.error)throw ins.error;
 localStorage.removeItem("thr_pending_profile");
}

async function goIfSignedIn(){
 var r=await client.auth.getSession();
 if(r.data&&r.data.session){
   try{await completePending(r.data.session.user)}catch(e){status("เชื่อมโปรไฟล์ไม่สำเร็จ: "+e.message,true);return}
   location.replace("748203619558.html");
 }
}
goIfSignedIn();

form.addEventListener("submit",async function(e){
 e.preventDefault();status("");
 var email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 if(!email||!password){status("กรุณากรอกอีเมลและรหัสผ่าน",true);return}
 btn.disabled=true;btn.textContent="กำลังเข้าสู่ระบบ...";
 try{
   var res=await client.auth.signInWithPassword({email:email,password:password});
   if(res.error)throw res.error;
   await completePending(res.data.user);
   location.replace("748203619558.html");
 }catch(err){status("เข้าสู่ระบบไม่สำเร็จ: "+err.message,true)}
 finally{btn.disabled=false;btn.textContent="เข้าสู่ระบบ"}
});

var cv=document.getElementById("stars"),x=cv.getContext("2d"),S=[];
function size(){cv.width=innerWidth;cv.height=innerHeight;S=[];for(var i=0;i<100;i++)S.push([Math.random()*cv.width,Math.random()*cv.height,Math.random()*1.1+.2,Math.random()*6])}
function draw(t){x.clearRect(0,0,cv.width,cv.height);S.forEach(function(s){x.globalAlpha=.2+.4*Math.abs(Math.sin(t/2500+s[3]));x.fillStyle="#dcd6ee";x.beginPath();x.arc(s[0],s[1],s[2],0,7);x.fill()});if(!matchMedia("(prefers-reduced-motion:reduce)").matches)requestAnimationFrame(draw)}
size();addEventListener("resize",size);requestAnimationFrame(draw);

</script>

<script id="thr-ultra-smooth-script">
(function(){
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
  var root=document.body;
  var raf=0,lastX=innerWidth*.5,lastY=innerHeight*.2;

  function paintPointer(){
    raf=0;
    root.style.setProperty("--mx",lastX+"px");
    root.style.setProperty("--my",lastY+"px");
  }
  if(!reduce){
    addEventListener("pointermove",function(e){
      lastX=e.clientX; lastY=e.clientY;
      if(!raf)raf=requestAnimationFrame(paintPointer);
    },{passive:true});
  }

  var revealNodes=[].slice.call(document.querySelectorAll("main,.card,.account-card,.music-box,#profile"));
  revealNodes.forEach(function(el,i){
    if(el.id==="profile" && el.hidden)return;
    el.classList.add("thr-reveal");
    requestAnimationFrame(function(){
      setTimeout(function(){el.classList.add("thr-in")},Math.min(i*55,260));
    });
  });

  document.querySelectorAll("button,.pick,.music-pick,.join-link").forEach(function(el){
    el.classList.add("thr-shine");
  });

  if(fine&&!reduce){
    document.querySelectorAll(".card,.account-card,#profile").forEach(function(card){
      var tr=0;
      card.addEventListener("pointermove",function(e){
        var r=card.getBoundingClientRect();
        var px=(e.clientX-r.left)/r.width-.5;
        var py=(e.clientY-r.top)/r.height-.5;
        if(tr)return;
        tr=requestAnimationFrame(function(){
          tr=0;
          card.style.transform="perspective(900px) rotateX("+(-py*1.5)+"deg) rotateY("+(px*1.8)+"deg) translateZ(0)";
        });
      },{passive:true});
      card.addEventListener("pointerleave",function(){
        card.style.transform="perspective(900px) rotateX(0) rotateY(0) translateZ(0)";
      },{passive:true});
    });
  }

  document.addEventListener("pointerdown",function(e){
    if(reduce)return;
    if(!e.target.closest("button,a,.pick,.music-pick,.member,.member-marker"))return;
    var ring=document.createElement("span");
    ring.className="thr-ripple";
    ring.style.left=e.clientX+"px";
    ring.style.top=e.clientY+"px";
    document.body.appendChild(ring);
    setTimeout(function(){ring.remove()},520);
  },{passive:true});
})();
</script>

</body></html>
