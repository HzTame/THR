  g.addColorStop(1,"rgba(255,247,232,"+(fade*.95)+")");
  ctx.globalAlpha=1;
  ctx.strokeStyle=g;
  ctx.lineWidth=1.35;
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(sh.x,sh.y);ctx.stroke();

  ctx.globalAlpha=fade*.95;
  ctx.fillStyle="#fff7e8";
  ctx.beginPath();ctx.arc(sh.x,sh.y,1.35,0,Math.PI*2);ctx.fill();

  return sh.x>-220&&sh.x<w+220&&sh.y<h+220;
}

function frame(t){
  ctx.clearRect(0,0,w,h);
  for(var i=0;i<stars.length;i++)drawStar(stars[i],t);

  if(!reduce){
    if(t>=nextShoot){
      newShooter(t);
      if(!mobile && Math.random()<.20){
        setTimeout(function(){
          var now=performance.now();
          newShooter(now);
        },rnd(130,280));
      }
      nextShoot=t+rnd(mobile?4200:3200,mobile?7600:6500);
    }

    for(var j=shooters.length-1;j>=0;j--){
      if(!drawShooter(shooters[j],t))shooters.splice(j,1);
    }
  }

  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}

reset();
nextShoot=performance.now()+rnd(900,2200);
addEventListener("resize",function(){
  mobile=matchMedia("(max-width:799px)").matches;
  reset();
},{passive:true});
requestAnimationFrame(frame);
})();
</script>
